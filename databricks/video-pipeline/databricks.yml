bundle:
  name: qprisma-video-pipeline

variables:
  catalog:
    description: Unity Catalog catalog for QPrisma video pipeline assets.
    default: dbw_qprisma_dev
  schema:
    description: Unity Catalog schema for QPrisma video pipeline assets.
    default: video
  queue_name:
    description: Service Bus queue consumed by the Databricks video pipeline.
    default: video-processing
  neo4j_uri:
    description: Deployment-owned Neo4j Bolt URI. Leave empty to skip graph projection.
    default: ""
  neo4j_user:
    description: Neo4j user for graph projection.
    default: neo4j
  neo4j_database:
    description: Neo4j database for graph projection.
    default: neo4j
  neo4j_allowed_host_suffixes:
    description: Optional comma-separated Neo4j host suffix allowlist.
    default: ""
  neo4j_password_secret_scope:
    description: Databricks secret scope that stores the Neo4j password. Used only when Neo4j projection is enabled.
    default: qprisma
  neo4j_password_secret_key:
    description: Databricks secret key that stores the Neo4j password. Used only when Neo4j projection is enabled.
    default: neo4j-password
  florence_cpu_node_type:
    description: Azure Databricks CPU node type for Florence-2 smoke frame analysis while GPU quota is unavailable.
    default: Standard_DS3_v2
  florence_model_revision:
    description: Pinned microsoft/Florence-2-large-ft commit SHA used with trust_remote_code.
    default: 4a12a2b54b7016a48a22037fbd62da90cd566f2a
  warm_cluster_autotermination_minutes:
    description: Idle minutes before the dedicated warm cluster auto-terminates.
    default: 120

resources:
  clusters:
    video_processing_warm:
      cluster_name: qprisma-video-processing-${bundle.target}-warm
      spark_version: 16.4.x-cpu-ml-scala2.12
      node_type_id: ${var.florence_cpu_node_type}
      num_workers: 0
      data_security_mode: SINGLE_USER
      autotermination_minutes: ${var.warm_cluster_autotermination_minutes}
      spark_conf:
        spark.databricks.cluster.profile: singleNode
        spark.master: local[*, 4]
      spark_env_vars:
        AZURE_OPENAI_ENDPOINT: "{{secrets/qprisma/azure-openai-endpoint}}"
        AZURE_OPENAI_API_KEY: "{{secrets/qprisma/azure-openai-api-key}}"
        NEO4J_URI: ${var.neo4j_uri}
        NEO4J_USER: ${var.neo4j_user}
        NEO4J_DATABASE: ${var.neo4j_database}
        NEO4J_ALLOWED_HOST_SUFFIXES: ${var.neo4j_allowed_host_suffixes}
        NEO4J_PASSWORD_SECRET_SCOPE: ${var.neo4j_password_secret_scope}
        NEO4J_PASSWORD_SECRET_KEY: ${var.neo4j_password_secret_key}
        QPRISMA_FLORENCE_MODEL_REVISION: ${var.florence_model_revision}
      init_scripts:
        - workspace:
            destination: ${workspace.file_path}/scripts/install-ffmpeg.sh
      custom_tags:
        Workload: QPrismaVideoProcessing
        Accelerator: CPU
        ResourceClass: SingleNode

  schemas:
    video_pipeline:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: QPrisma video pipeline operational tables.

  volumes:
    source_media:
      name: source_media
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      volume_type: MANAGED
      comment: Managed Unity Catalog volume for Databricks-readable QPrisma source media staging.
    video_artifacts:
      name: video_artifacts
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      volume_type: MANAGED
      comment: Managed Unity Catalog volume for QPrisma video ETL audio, frame and inference artifacts.

  jobs:
    video_processing:
      name: qprisma-video-processing-${bundle.target}
      description: Observable Databricks lakehouse workflow for QPrisma video understanding.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: queue_name
          default: ${var.queue_name}
        - name: schema_version
          default: "2026-05-01"
        - name: dispatch_id
          default: ""
        - name: media_id
          default: ""
        - name: blob_name
          default: ""
        - name: user_id
          default: ""
        - name: source_media
          default: "{}"
        - name: pipeline_config
          default: "{}"
      tasks:
        - task_key: register_manifest
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: register_manifest
        - task_key: validate_and_probe_media
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: register_manifest
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: validate_and_probe_media
        - task_key: extract_audio_assets
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: validate_and_probe_media
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: extract_audio_assets
        - task_key: extract_frame_assets
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: validate_and_probe_media
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: extract_frame_assets
        - task_key: run_florence_frame_analysis
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: extract_frame_assets
          libraries:
            - pypi:
                package: transformers>=4.46.0
            - pypi:
                package: accelerate>=0.33.0
            - pypi:
                package: timm>=1.0.0
            - pypi:
                package: einops>=0.8.0
            - pypi:
                package: pillow>=10.4.0
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: run_florence_frame_analysis
        - task_key: run_faster_whisper_asr
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: extract_audio_assets
          libraries:
            - pypi:
                package: faster-whisper==1.1.1
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: run_faster_whisper_asr
        - task_key: detect_scenes_and_windows
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: extract_frame_assets
            - task_key: run_faster_whisper_asr
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: detect_scenes_and_windows
        - task_key: run_databricks_scene_reasoning
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: detect_scenes_and_windows
            - task_key: run_florence_frame_analysis
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: run_databricks_scene_reasoning
        - task_key: build_gold_processing_result
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: run_databricks_scene_reasoning
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: build_gold_processing_result
        - task_key: build_graph_upserts
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: build_gold_processing_result
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: build_graph_upserts
        - task_key: project_neo4j_graph
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: build_graph_upserts
          libraries:
            - pypi:
                package: "neo4j>=5.26.0,<6.0.0"
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: project_neo4j_graph
        - task_key: publish_outbox
          existing_cluster_id: ${resources.clusters.video_processing_warm.id}
          depends_on:
            - task_key: project_neo4j_graph
          notebook_task:
            notebook_path: ./notebooks/video_pipeline_ops.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              queue_name: "{{job.parameters.queue_name}}"
              schema_version: "{{job.parameters.schema_version}}"
              dispatch_id: "{{job.parameters.dispatch_id}}"
              media_id: "{{job.parameters.media_id}}"
              blob_name: "{{job.parameters.blob_name}}"
              user_id: "{{job.parameters.user_id}}"
              source_media: "{{job.parameters.source_media}}"
              pipeline_config: "{{job.parameters.pipeline_config}}"
              stage: publish_outbox

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: qprisma_prod
      schema: video
