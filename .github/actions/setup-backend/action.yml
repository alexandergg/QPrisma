name: Setup Python Backend
description: Setup Python 3.11, uv, and install backend dependencies

inputs:
  working-directory:
    description: Working directory for backend
    required: false
    default: backend

runs:
  using: composite
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        uv pip install --system -e .
        uv pip install --system pytest pytest-asyncio pytest-cov black ruff pre-commit freezegun hypothesis respx

    - name: Verify installation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python --version
        uv --version
        pytest --version
        ruff --version
        black --version
        pre-commit --version
