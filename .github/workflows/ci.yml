name: QPrisma CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:          # Allow release.yml to call this workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          working-directory: backend

      - name: Run pre-commit on changed backend files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FROM_SHA="${{ github.event.pull_request.base.sha }}"
            TO_SHA="${{ github.event.pull_request.head.sha }}"
          else
            FROM_SHA="${{ github.event.before }}"
            TO_SHA="${{ github.sha }}"
          fi

          echo "Comparing changes from $FROM_SHA to $TO_SHA"

          mapfile -t changed_files < <(git diff --name-only "$FROM_SHA" "$TO_SHA" -- 'backend/**/*.py')

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "No backend Python files changed. Skipping pre-commit."
            exit 0
          fi

          printf 'Changed backend Python files:\n%s\n' "${changed_files[@]}"
          pre-commit run --files "${changed_files[@]}"

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          working-directory: backend

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short -x \
            -m "not integration and not e2e and not slow and not requires_azure and not requires_redis and not requires_neo4j and not requires_postgres" \
            --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=35

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend

      - name: Run ESLint
        run: npm run lint

  frontend-typecheck:
    name: Frontend Type Checking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend

      - name: Run TypeScript check
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend

      - name: Run Jest tests
        run: npm test -- --ci --coverage
