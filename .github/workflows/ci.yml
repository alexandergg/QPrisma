name: QPrisma CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          working-directory: backend

      - name: Run ruff check
        run: ruff check .

      - name: Run black check
        run: black --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          working-directory: backend

      - name: Run pytest
        run: pytest tests/ -v --tb=short -x -m "not requires_azure and not requires_redis and not requires_neo4j and not requires_postgres"

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend

      - name: Run ESLint
        run: npm run lint

  frontend-typecheck:
    name: Frontend Type Checking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend

      - name: Run TypeScript check
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend

      - name: Run Jest tests
        run: npm test -- --ci --coverage
