name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      DATABRICKS_VIDEO_JOB_ID: ${{ vars.DATABRICKS_VIDEO_JOB_ID || '' }}
      DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.DATABRICKS_SQL_WAREHOUSE_ID || '' }}
      DATABRICKS_OUTBOX_CATALOG: ${{ vars.DATABRICKS_OUTBOX_CATALOG || 'dbw_qprisma_dev' }}
      DATABRICKS_OUTBOX_SCHEMA: ${{ vars.DATABRICKS_OUTBOX_SCHEMA || 'video' }}
      DATABRICKS_OUTBOX_TABLE: ${{ vars.DATABRICKS_OUTBOX_TABLE || 'video_pipeline_outbox' }}
      DATABRICKS_OUTBOX_POLL_BATCH_SIZE: ${{ vars.DATABRICKS_OUTBOX_POLL_BATCH_SIZE || '25' }}
      DATABRICKS_OUTBOX_POLL_SCHEDULE: ${{ vars.DATABRICKS_OUTBOX_POLL_SCHEDULE || '0 */5 * * * *' }}
      PROCESSING_BACKEND: ${{ vars.PROCESSING_BACKEND || 'servicebus' }}
      DATABRICKS_BRIDGE_AUTH_TYPE: ${{ vars.DATABRICKS_BRIDGE_AUTH_TYPE || 'oauth_m2m' }}
      DATABRICKS_BRIDGE_CLIENT_ID: ${{ vars.DATABRICKS_BRIDGE_CLIENT_ID || '' }}
      DATABRICKS_BRIDGE_CLIENT_SECRET: ${{ secrets.DATABRICKS_BRIDGE_CLIENT_SECRET || '' }}
      DATABRICKS_BRIDGE_TOKEN: ${{ secrets.DATABRICKS_BRIDGE_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve GitHub OIDC service principal object ID
        id: oidc-sp
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          OIDC_SP_OBJECT_ID="$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv)"
          if [ -z "$OIDC_SP_OBJECT_ID" ]; then
            echo "::error::Could not resolve the GitHub OIDC service principal object ID from AZURE_CLIENT_ID"
            exit 1
          fi
          echo "object_id=$OIDC_SP_OBJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location "westeurope" \
            --output none

      - name: Validate Entra ID configuration
        run: |
          for var in ENTRA_TENANT_ID ENTRA_CLIENT_ID ENTRA_API_SCOPE; do
            if [ -z "${!var}" ]; then
              echo "::error::Required environment variable $var is empty or unset"
              exit 1
            fi
          done
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}

      - name: Validate Bicep template
        run: |
          az deployment group validate \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              neo4jUri='${{ secrets.NEO4J_URI }}' \
              neo4jUser='${{ secrets.NEO4J_USER || 'neo4j' }}' \
              neo4jDatabase='${{ secrets.NEO4J_DATABASE || 'neo4j' }}' \
              benchmarkApiToken='${{ secrets.BENCHMARK_API_TOKEN }}' \
              entraAuthTenantId='${{ vars.ENTRA_TENANT_ID }}' \
              entraAuthClientId='${{ vars.ENTRA_CLIENT_ID }}' \
              entraAuthApiScope='${{ vars.ENTRA_API_SCOPE }}' \
              githubOidcPrincipalObjectId='${{ steps.oidc-sp.outputs.object_id }}'

      - name: Preview changes (What-If)
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              neo4jUri='${{ secrets.NEO4J_URI }}' \
              neo4jUser='${{ secrets.NEO4J_USER || 'neo4j' }}' \
              neo4jDatabase='${{ secrets.NEO4J_DATABASE || 'neo4j' }}' \
              benchmarkApiToken='${{ secrets.BENCHMARK_API_TOKEN }}' \
              entraAuthTenantId='${{ vars.ENTRA_TENANT_ID }}' \
              entraAuthClientId='${{ vars.ENTRA_CLIENT_ID }}' \
              entraAuthApiScope='${{ vars.ENTRA_API_SCOPE }}' \
              githubOidcPrincipalObjectId='${{ steps.oidc-sp.outputs.object_id }}'

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    env:
      DATABRICKS_VIDEO_JOB_ID: ${{ vars.DATABRICKS_VIDEO_JOB_ID || '' }}
      DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.DATABRICKS_SQL_WAREHOUSE_ID || '' }}
      DATABRICKS_OUTBOX_CATALOG: ${{ vars.DATABRICKS_OUTBOX_CATALOG || 'dbw_qprisma_dev' }}
      DATABRICKS_OUTBOX_SCHEMA: ${{ vars.DATABRICKS_OUTBOX_SCHEMA || 'video' }}
      DATABRICKS_OUTBOX_TABLE: ${{ vars.DATABRICKS_OUTBOX_TABLE || 'video_pipeline_outbox' }}
      DATABRICKS_OUTBOX_POLL_BATCH_SIZE: ${{ vars.DATABRICKS_OUTBOX_POLL_BATCH_SIZE || '25' }}
      DATABRICKS_OUTBOX_POLL_SCHEDULE: ${{ vars.DATABRICKS_OUTBOX_POLL_SCHEDULE || '0 */5 * * * *' }}
      PROCESSING_BACKEND: ${{ vars.PROCESSING_BACKEND || 'servicebus' }}
      DATABRICKS_BRIDGE_AUTH_TYPE: ${{ vars.DATABRICKS_BRIDGE_AUTH_TYPE || 'oauth_m2m' }}
      DATABRICKS_BRIDGE_CLIENT_ID: ${{ vars.DATABRICKS_BRIDGE_CLIENT_ID || '' }}
      DATABRICKS_BRIDGE_CLIENT_SECRET: ${{ secrets.DATABRICKS_BRIDGE_CLIENT_SECRET || '' }}
      DATABRICKS_BRIDGE_TOKEN: ${{ secrets.DATABRICKS_BRIDGE_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve GitHub OIDC service principal object ID
        id: oidc-sp
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          OIDC_SP_OBJECT_ID="$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv)"
          if [ -z "$OIDC_SP_OBJECT_ID" ]; then
            echo "::error::Could not resolve the GitHub OIDC service principal object ID from AZURE_CLIENT_ID"
            exit 1
          fi
          echo "object_id=$OIDC_SP_OBJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location "westeurope" \
            --output none

      - name: Deploy Bicep template
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 60
          command: |
            az deployment group create \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters infra/parameters/dev.bicepparam \
              --parameters \
                dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
                neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
                neo4jUri='${{ secrets.NEO4J_URI }}' \
                neo4jUser='${{ secrets.NEO4J_USER || 'neo4j' }}' \
                neo4jDatabase='${{ secrets.NEO4J_DATABASE || 'neo4j' }}' \
                benchmarkApiToken='${{ secrets.BENCHMARK_API_TOKEN }}' \
                entraAuthTenantId='${{ vars.ENTRA_TENANT_ID }}' \
                entraAuthClientId='${{ vars.ENTRA_CLIENT_ID }}' \
                entraAuthApiScope='${{ vars.ENTRA_API_SCOPE }}' \
                githubOidcPrincipalObjectId='${{ steps.oidc-sp.outputs.object_id }}'

      - name: Clean up legacy Neo4j Container App
        run: |
          NEO4J_CA="ca-qprisma-neo4j-${{ inputs.environment || 'dev' }}"
          if az containerapp show --name "$NEO4J_CA" \
               --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
               --output none 2>/dev/null; then
            echo "Deleting legacy Neo4j Container App: $NEO4J_CA"
            az containerapp delete --name "$NEO4J_CA" \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --yes --output none
            echo "  Deleted."
          else
            echo "No legacy Neo4j Container App found — nothing to clean up."
          fi

      - name: Deployment summary
        run: |
          echo "## Infrastructure Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Name |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | ${{ vars.AZURE_RESOURCE_GROUP }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault | ${{ vars.KEY_VAULT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Neo4j | AuraDB (external, URI from secrets) |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Foundry | Referenced (deployed separately via deploy-ai-foundry.yml) |" >> $GITHUB_STEP_SUMMARY

  restore-containers:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Trigger app deployment with latest images
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-app.yml',
              ref: 'main',
              inputs: {
                image_tag: 'latest',
                deploy_api: 'true',
                deploy_frontend: 'true'
              }
            });
            console.log('Triggered deploy-app.yml with image_tag: latest to restore containers after infra update');

      - name: Trigger Databricks bridge Function deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-function-bridge.yml',
              ref: 'main',
              inputs: {
                function_app_name: "${{ vars.DATABRICKS_BRIDGE_FUNCTION_APP_NAME || 'func-qprisma-dbx-bridge-flex-dev' }}"
              }
            });
            console.log('Triggered deploy-function-bridge.yml for the Databricks dispatch bridge');
