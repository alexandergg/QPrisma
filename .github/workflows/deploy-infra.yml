name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location ${{ vars.AZURE_LOCATION || 'westeurope' }} \
            --output none

      - name: Validate Bicep template
        run: |
          az deployment group validate \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}'

      - name: Preview changes (What-If)
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}'

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location ${{ vars.AZURE_LOCATION || 'westeurope' }} \
            --output none

      - name: Cancel stale ARM deployments
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          echo "Checking for in-progress ARM deployments..."
          RUNNING=$(az deployment group list \
            --resource-group "$RG" \
            --filter "provisioningState eq 'Running'" \
            --query "[].name" -o tsv 2>/dev/null || true)
          if [ -n "$RUNNING" ]; then
            for DEPLOY_NAME in $RUNNING; do
              echo "  Cancelling stale deployment: $DEPLOY_NAME"
              az deployment group cancel \
                --resource-group "$RG" \
                --name "$DEPLOY_NAME" 2>/dev/null || true
            done
            echo "Waiting 30s for cancellation to propagate..."
            sleep 30
          else
            echo "  No stale deployments found."
          fi

      - name: Wait for AI Foundry provisioning to settle
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          AI_NAME="aif-qprisma-${{ vars.ENVIRONMENT || 'dev' }}"

          # Skip if the resource doesn't exist yet (first-ever deploy)
          if ! az cognitiveservices account show \
            --name "$AI_NAME" --resource-group "$RG" \
            --query "name" -o tsv 2>/dev/null; then
            echo "AI Foundry resource does not exist yet — skipping wait."
            exit 0
          fi

          # 1. Wait for account-level provisioning state
          echo "Polling AI Foundry account state (up to 10 min)..."
          for i in $(seq 1 20); do
            STATE=$(az cognitiveservices account show \
              --name "$AI_NAME" --resource-group "$RG" \
              --query "properties.provisioningState" -o tsv 2>/dev/null || echo "Unknown")
            echo "  [$i/20] Account provisioningState=$STATE"
            if [ "$STATE" = "Succeeded" ] || [ "$STATE" = "Failed" ] || [ "$STATE" = "Unknown" ]; then
              break
            fi
            sleep 30
          done

          # 2. Wait for all model deployments to reach terminal state
          echo "Checking model deployment states..."
          for attempt in $(seq 1 10); do
            NON_TERMINAL=$(az cognitiveservices account deployment list \
              --name "$AI_NAME" --resource-group "$RG" \
              --query "[?properties.provisioningState!='Succeeded' && properties.provisioningState!='Failed'].{name:name, state:properties.provisioningState}" \
              -o tsv 2>/dev/null || true)
            if [ -z "$NON_TERMINAL" ]; then
              echo "  All model deployments in terminal state."
              break
            fi
            echo "  [$attempt/10] Waiting on model deployments: $NON_TERMINAL"
            sleep 30
          done

      - name: Deploy Bicep template
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 120
          command: |
            az deployment group create \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters infra/parameters/dev.bicepparam \
              --parameters \
                dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
                neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
                jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}'

      - name: Sync additional secrets to Key Vault
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set Key Vault secrets
        run: |
          az keyvault secret set \
            --vault-name ${{ vars.KEY_VAULT_NAME }} \
            --name "jwt-secret-key" \
            --value "${{ secrets.JWT_SECRET_KEY }}"

      - name: Deployment summary
        run: |
          echo "## Infrastructure Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Name |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | ${{ vars.AZURE_RESOURCE_GROUP }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault | ${{ vars.KEY_VAULT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Neo4j | Provisioned as Container App (internal) |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenAI | Provisioned via AI Foundry (5 model deployments) |" >> $GITHUB_STEP_SUMMARY
