name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location "westeurope" \
            --output none

      - name: Validate Entra ID configuration
        run: |
          for var in ENTRA_TENANT_ID ENTRA_CLIENT_ID ENTRA_API_SCOPE; do
            if [ -z "${!var}" ]; then
              echo "::error::Required environment variable $var is empty or unset"
              exit 1
            fi
          done
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}

      - name: Validate Bicep template
        run: |
          az deployment group validate \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}' \
              entraAuthTenantId='${{ vars.ENTRA_TENANT_ID }}' \
              entraAuthClientId='${{ vars.ENTRA_CLIENT_ID }}' \
              entraAuthApiScope='${{ vars.ENTRA_API_SCOPE }}'

      - name: Preview changes (What-If)
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}' \
              entraAuthTenantId='${{ vars.ENTRA_TENANT_ID }}' \
              entraAuthClientId='${{ vars.ENTRA_CLIENT_ID }}' \
              entraAuthApiScope='${{ vars.ENTRA_API_SCOPE }}'

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location "westeurope" \
            --output none

      - name: Deploy Bicep template
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 60
          command: |
            az deployment group create \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters infra/parameters/dev.bicepparam \
              --parameters \
                dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
                neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
                jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}' \
                entraAuthTenantId='${{ vars.ENTRA_TENANT_ID }}' \
                entraAuthClientId='${{ vars.ENTRA_CLIENT_ID }}' \
                entraAuthApiScope='${{ vars.ENTRA_API_SCOPE }}'

      - name: Set Key Vault secrets
        run: |
          az keyvault secret set \
            --vault-name ${{ vars.KEY_VAULT_NAME }} \
            --name "jwt-secret-key" \
            --value "${{ secrets.JWT_SECRET_KEY }}"

      - name: Deployment summary
        run: |
          echo "## Infrastructure Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Name |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | ${{ vars.AZURE_RESOURCE_GROUP }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault | ${{ vars.KEY_VAULT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Neo4j | Provisioned as Container App (internal) |" >> $GITHUB_STEP_SUMMARY
          echo "| AI Foundry | Referenced (deployed separately via deploy-ai-foundry.yml) |" >> $GITHUB_STEP_SUMMARY
