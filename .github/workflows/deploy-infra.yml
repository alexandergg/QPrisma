name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location ${{ vars.AZURE_LOCATION || 'westeurope' }} \
            --output none

      - name: Validate Bicep template
        run: |
          az deployment group validate \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}'

      - name: Preview changes (What-If)
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}'

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location ${{ vars.AZURE_LOCATION || 'westeurope' }} \
            --output none

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --parameters \
              dbAdminPassword='${{ secrets.DB_ADMIN_PASSWORD }}' \
              neo4jPassword='${{ secrets.NEO4J_PASSWORD }}' \
              jwtSecretKey='${{ secrets.JWT_SECRET_KEY }}'

      - name: Sync additional secrets to Key Vault
        run: |
          az keyvault secret set \
            --vault-name ${{ vars.KEY_VAULT_NAME }} \
            --name "jwt-secret-key" \
            --value "${{ secrets.JWT_SECRET_KEY }}"

      - name: Deployment summary
        run: |
          echo "## Infrastructure Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Name |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | ${{ vars.AZURE_RESOURCE_GROUP }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault | ${{ vars.KEY_VAULT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Neo4j | Provisioned as Container App (internal) |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenAI | Provisioned via AI Foundry (5 model deployments) |" >> $GITHUB_STEP_SUMMARY
