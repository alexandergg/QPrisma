name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
        type: string
      deploy_api:
        description: 'Deploy API container'
        required: false
        default: true
        type: boolean
      deploy_worker:
        description: 'Deploy Worker container'
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend container'
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  deploy-api:
    if: ${{ github.event.inputs.deploy_api == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      previous_revision: ${{ steps.get-revision.outputs.revision }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: set-tag
        run: |
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          echo "Deploying image tag: ${{ github.event.inputs.image_tag }}"

      - name: Get current revision for rollback
        id: get-revision
        run: |
          REVISION=$(az containerapp revision list \
            --name ca-qprisma-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.active].name" \
            -o tsv | head -n 1)
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "Current active revision: $REVISION"

      - name: Update API container
        run: |
          az containerapp update \
            --name ca-qprisma-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/qprisma-api:${{ env.IMAGE_TAG }}

      - name: Wait for revision to be ready
        run: |
          echo "Waiting for new revision to be ready..."
          for i in {1..20}; do
            STATUS=$(az containerapp show \
              --name ca-qprisma-api-dev \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv)

            if [ "$STATUS" == "Running" ]; then
              echo "Revision is ready (status: $STATUS)"
              break
            fi

            echo "Attempt $i/20: Status is $STATUS, waiting 15s..."
            sleep 15
          done

      - name: Health check
        id: health-check
        run: |
          FQDN=$(az containerapp show \
            --name ca-qprisma-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Health checking https://$FQDN/health ..."
          for i in {1..10}; do
            if curl -sf "https://$FQDN/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, waiting 10s..."
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health-check.outcome == 'failure'
        run: |
          echo "Rolling back to previous revision: ${{ steps.get-revision.outputs.revision }}"
          az containerapp revision activate \
            --name ca-qprisma-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --revision ${{ steps.get-revision.outputs.revision }}

  deploy-worker:
    if: ${{ github.event.inputs.deploy_worker == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV

      - name: Update Worker container
        run: |
          az containerapp update \
            --name ca-qprisma-worker-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/qprisma-worker:${{ env.IMAGE_TAG }}

      - name: Wait for revision to be ready
        run: |
          echo "Waiting for worker revision to be ready..."
          for i in {1..20}; do
            STATUS=$(az containerapp show \
              --name ca-qprisma-worker-dev \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv)

            if [ "$STATUS" == "Running" ]; then
              echo "Worker revision is ready (status: $STATUS)"
              break
            fi

            echo "Attempt $i/20: Status is $STATUS, waiting 15s..."
            sleep 15
          done

  deploy-frontend:
    if: ${{ github.event.inputs.deploy_frontend == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      previous_revision: ${{ steps.get-revision.outputs.revision }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV

      - name: Get current revision for rollback
        id: get-revision
        run: |
          REVISION=$(az containerapp revision list \
            --name ca-qprisma-web-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.active].name" \
            -o tsv | head -n 1)
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "Current active revision: $REVISION"

      - name: Update Frontend container
        run: |
          az containerapp update \
            --name ca-qprisma-web-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/qprisma-frontend:${{ env.IMAGE_TAG }}

      - name: Wait for revision to be ready
        run: |
          echo "Waiting for frontend revision to be ready..."
          for i in {1..20}; do
            STATUS=$(az containerapp show \
              --name ca-qprisma-web-dev \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --query "properties.runningStatus" \
              -o tsv)

            if [ "$STATUS" == "Running" ]; then
              echo "Frontend revision is ready (status: $STATUS)"
              break
            fi

            echo "Attempt $i/20: Status is $STATUS, waiting 15s..."
            sleep 15
          done

      - name: Health check
        id: health-check
        run: |
          FQDN=$(az containerapp show \
            --name ca-qprisma-web-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Health checking https://$FQDN/ ..."
          for i in {1..10}; do
            if curl -sf "https://$FQDN/"; then
              echo "Frontend health check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, waiting 10s..."
            sleep 10
          done
          echo "Frontend health check failed after 10 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health-check.outcome == 'failure'
        run: |
          echo "Rolling back to previous revision: ${{ steps.get-revision.outputs.revision }}"
          az containerapp revision activate \
            --name ca-qprisma-web-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --revision ${{ steps.get-revision.outputs.revision }}

  smoke-test:
    needs: [deploy-api, deploy-worker, deploy-frontend]
    if: ${{ always() && (github.event.inputs.deploy_api == 'true' || github.event.inputs.deploy_worker == 'true' || github.event.inputs.deploy_frontend == 'true') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify API health
        run: |
          API_FQDN=$(az containerapp show \
            --name ca-qprisma-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Verifying API health at https://$API_FQDN/health ..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://$API_FQDN/health")
          if [ "$RESPONSE" == "200" ]; then
            echo "API health check passed (HTTP $RESPONSE)"
          else
            echo "API health check failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Verify Frontend loads
        run: |
          WEB_FQDN=$(az containerapp show \
            --name ca-qprisma-web-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "Verifying frontend at https://$WEB_FQDN/ ..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://$WEB_FQDN/")
          if [ "$RESPONSE" == "200" ]; then
            echo "Frontend health check passed (HTTP $RESPONSE)"
          else
            echo "Frontend health check failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Deployment summary
        run: |
          API_FQDN=$(az containerapp show \
            --name ca-qprisma-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          WEB_FQDN=$(az containerapp show \
            --name ca-qprisma-web-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Services" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://$API_FQDN" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://$WEB_FQDN" >> $GITHUB_STEP_SUMMARY
          echo "- Worker: Deployed (no public endpoint)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tag" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
