name: Build and Push Images

run-name: Build images for ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'

  build-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/qprisma-api:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/qprisma-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: "${{ vars.ACR_LOGIN_SERVER }}/qprisma-api:${{ github.sha }}"
          format: "sarif"
          output: "trivy-api.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy API scan results
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: "trivy-api.sarif"
          category: "trivy-api"

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Resolve API FQDN
        id: resolve-fqdn
        run: |
          API_FQDN=$(az containerapp show \
            --name ca-qprisma-api-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "api_fqdn=$API_FQDN" >> $GITHUB_OUTPUT
          echo "Resolved API FQDN: $API_FQDN"

      - name: Resolve Frontend FQDN (for Entra redirect URI)
        id: resolve-frontend-fqdn
        run: |
          FRONTEND_FQDN=$(az containerapp show \
            --name ca-qprisma-web-dev \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv 2>/dev/null || true)
          if [ -z "$FRONTEND_FQDN" ]; then
            echo "::warning::Could not resolve frontend FQDN — container app may not exist yet. Falling back to localhost."
            FRONTEND_FQDN="localhost:3000"
          fi
          echo "frontend_fqdn=$FRONTEND_FQDN" >> $GITHUB_OUTPUT
          echo "Resolved Frontend FQDN: $FRONTEND_FQDN"

      # Requires the OIDC service principal to have Microsoft Graph
      # Application.ReadWrite.OwnedBy (or Application.ReadWrite.All) permission.
      - name: Sync Entra ID SPA redirect URI
        if: steps.resolve-frontend-fqdn.outputs.frontend_fqdn != 'localhost:3000'
        continue-on-error: true
        run: |
          APP_ID="${{ vars.ENTRA_SPA_CLIENT_ID }}"
          REDIRECT_URI="https://${{ steps.resolve-frontend-fqdn.outputs.frontend_fqdn }}"
          REQUIRED_URIS=("$REDIRECT_URI" "$REDIRECT_URI/redirect" "http://localhost:3000" "http://localhost:3000/redirect")

          # Fetch existing redirect URIs so we merge instead of replace
          EXISTING=$(az rest --method GET \
            --uri "https://graph.microsoft.com/v1.0/applications(appId='$APP_ID')" \
            --query "spa.redirectUris" -o json 2>/dev/null || echo "[]")

          # Merge existing + required, deduplicate
          MERGED=$(echo "$EXISTING" | jq -c --argjson new "$(printf '%s\n' "${REQUIRED_URIS[@]}" | jq -R . | jq -s .)" '. + $new | unique')

          echo "Merged SPA redirect URIs: $MERGED"
          if az rest --method PATCH \
            --uri "https://graph.microsoft.com/v1.0/applications(appId='$APP_ID')" \
            --headers "Content-Type=application/json" \
            --body "{\"spa\":{\"redirectUris\":$MERGED}}"; then
            echo "✅ SPA redirect URIs updated for app $APP_ID"
          else
            echo "::warning::Failed to sync Entra SPA redirect URIs. Ensure the OIDC service principal has Application.ReadWrite.OwnedBy on the app registration."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/qprisma-frontend:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/qprisma-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ steps.resolve-fqdn.outputs.api_fqdn }}
            NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.ENTRA_SPA_CLIENT_ID }}
            NEXT_PUBLIC_ENTRA_AUTHORITY=https://login.microsoftonline.com/${{ vars.ENTRA_TENANT_ID }}
            NEXT_PUBLIC_ENTRA_REDIRECT_URI=https://${{ steps.resolve-frontend-fqdn.outputs.frontend_fqdn }}
            NEXT_PUBLIC_ENTRA_API_SCOPE=${{ vars.ENTRA_API_SCOPE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan Frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          image-ref: "${{ vars.ACR_LOGIN_SERVER }}/qprisma-frontend:${{ github.sha }}"
          format: "sarif"
          output: "trivy-frontend.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy Frontend scan results
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: "trivy-frontend.sarif"
          category: "trivy-frontend"

  trigger-deploy:
    needs: [detect-changes, build-api, build-frontend]
    permissions:
      actions: write
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_API: ${{ needs.detect-changes.outputs.backend_changed == 'true' || github.event_name == 'workflow_dispatch' }}
      DEPLOY_FRONTEND: ${{ needs.detect-changes.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Trigger deployment workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-app.yml',
              ref: 'main',
              inputs: {
                image_tag: '${{ github.sha }}',
                deploy_api: process.env.DEPLOY_API,
                deploy_frontend: process.env.DEPLOY_FRONTEND
              }
            });
            console.log(`Triggered deploy-app.yml with image_tag: ${{ github.sha }} (api=${process.env.DEPLOY_API}, frontend=${process.env.DEPLOY_FRONTEND})`);
