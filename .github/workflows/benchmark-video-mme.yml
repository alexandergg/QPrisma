name: Benchmark Video-MME

run-name: Benchmark Video-MME

on:
  workflow_dispatch:
    inputs:
      agent-version:
        description: 'Agent version override (e.g., "2"). Leave empty to auto-resolve.'
        required: false
        type: string
      mode:
        description: "Benchmark execution mode."
        required: true
        type: choice
        options:
          - full-pipeline
          - eval-only
        default: full-pipeline
      api-base-url:
        description: "QPrisma API base URL (required for full-pipeline mode)."
        required: false
        type: string
      source-container:
        description: "Blob container holding staged Video-MME mp4 files (full-pipeline mode)."
        required: false
        type: string
      source-prefix:
        description: "Optional blob prefix under source-container (full-pipeline mode)."
        required: false
        type: string
        default: ""
      source-storage-account:
        description: "Optional Azure Storage account name for source-container validation (e.g., 'stqprismadev'). A *.blob.core.windows.net hostname or full blob URL is also accepted and will be normalized to the account name. Do NOT pass the QPrisma API base URL. Leave empty to infer from questions-url when it is hosted on Azure Blob."
        required: false
        type: string
        default: ""
      questions-url:
        description: "HTTPS/SAS URL to the Video-MME parquet/jsonl metadata/questions file."
        required: true
        type: string
      manifest-url:
        description: "HTTPS/SAS URL to manifest.json (required for eval-only mode)."
        required: false
        type: string
      limit:
        description: "Smoke/sample size. Use 0 for full set."
        required: false
        type: number
        default: 5
      subtitle-modes:
        description: "Subtitle modes to evaluate."
        required: false
        type: choice
        options:
          - 'with without'
          - 'with'
          - 'without'
        default: 'without'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.mode }}
  cancel-in-progress: true

env:
  AGENT_NAME: qprisma-video-agent
  FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      agent-id: ${{ steps.resolve.outputs.agent_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install SDK
        run: pip install "azure-ai-projects==2.0.1" "azure-identity==1.25.0"

      - name: Resolve agent version
        id: resolve
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AGENT_NAME: ${{ env.AGENT_NAME }}
        run: |
          if [ -n "${{ inputs.agent-version }}" ]; then
            AGENT_ID="${AGENT_NAME}:${{ inputs.agent-version }}"
            echo "agent_id=${AGENT_ID}" >> "$GITHUB_OUTPUT"
          else
            python scripts/resolve_agent_version.py
          fi

  benchmark-video-mme:
    runs-on: ubuntu-latest
    needs: [resolve-version]
    environment: dev
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate inputs
        env:
          BENCHMARK_API_TOKEN: ${{ secrets.BENCHMARK_API_TOKEN }}
        run: |
          if [ -z "${{ inputs.questions-url }}" ]; then
            echo "::error::questions-url is required"
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "eval-only" ] && [ -z "${{ inputs.manifest-url }}" ]; then
            echo "::error::manifest-url is required for eval-only mode"
            exit 1
          fi
          if [ "${{ inputs.mode }}" = "full-pipeline" ]; then
            if [ -z "${{ inputs.api-base-url }}" ] || [ -z "${{ inputs.source-container }}" ]; then
              echo "::error::api-base-url and source-container are required for full-pipeline mode"
              exit 1
            fi
            if [ -z "$BENCHMARK_API_TOKEN" ]; then
              echo "::error::BENCHMARK_API_TOKEN secret is required for full-pipeline mode"
              exit 1
            fi
          fi

      - name: Install benchmark deps
        working-directory: backend
        run: |
          pip install pandas pyarrow "azure-ai-projects==2.0.1" "azure-identity==1.25.0"

      - name: Prepare stage directory
        run: |
          STAGE_DIR="${RUNNER_TEMP}/vmme"
          mkdir -p "$STAGE_DIR"
          echo "STAGE_DIR=$STAGE_DIR" >> "$GITHUB_ENV"

      - name: Download questions metadata
        env:
          QUESTIONS_URL: ${{ inputs.questions-url }}
        run: |
          QURL_PATH="${QUESTIONS_URL%%?*}"
          case "$QURL_PATH" in
            *.parquet) QFILE="questions.parquet" ;;
            *.jsonl)   QFILE="questions.jsonl" ;;
            *.json)    QFILE="questions.json" ;;
            *)         QFILE="questions.parquet" ;;
          esac

          download_with_auth_fallback() {
            local label="$1"
            local url="$2"
            local dest="$3"
            local parsed=()
            readarray -t parsed < <(FILE_URL="$url" python - <<'PY'
          from urllib.parse import urlparse, unquote
          import os

          parsed = urlparse(os.environ["FILE_URL"])
          host = (parsed.hostname or "").lower()
          path = parsed.path.lstrip("/")
          account = ""
          container = ""
          blob = ""
          is_blob = False
          if host.endswith(".blob.core.windows.net") and "/" in path:
              container, blob = path.split("/", 1)
              container = unquote(container)
              blob = unquote(blob)
              account = host.split(".", 1)[0]
              is_blob = bool(account and container and blob)
          print("azure-blob" if is_blob else "url")
          print(account)
          print(container)
          print(blob)
          PY
            )
            local download_method="${parsed[0]}"
            local account_name="${parsed[1]}"
            local container_name="${parsed[2]}"
            local blob_name="${parsed[3]}"

            if [ "$download_method" = "azure-blob" ]; then
              echo "Attempting Azure-authenticated download for $label from $account_name/$container_name/$blob_name"
              if az storage blob download \
                --auth-mode login \
                --account-name "$account_name" \
                --container-name "$container_name" \
                --name "$blob_name" \
                --file "$dest" \
                --overwrite true \
                --output none; then
                return 0
              fi
              if [ "$url" != "$QURL_PATH" ]; then
                echo "::warning::Azure-authenticated download failed for $label; retrying with the provided URL"
              else
                echo "::error::Azure-authenticated download failed for $label and no SAS/query fallback is available"
                return 1
              fi
            fi

            curl --fail-with-body -sSL -o "$dest" "$url"
          }

          download_with_auth_fallback "Video-MME questions metadata" "$QUESTIONS_URL" "$STAGE_DIR/$QFILE"
          echo "QFILE=$QFILE" >> "$GITHUB_ENV"

      - name: Download manifest (eval-only)
        if: ${{ inputs.mode == 'eval-only' }}
        env:
          MANIFEST_URL: ${{ inputs.manifest-url }}
        run: |
          MURL_PATH="${MANIFEST_URL%%?*}"

          download_with_auth_fallback() {
            local label="$1"
            local url="$2"
            local dest="$3"
            local parsed=()
            readarray -t parsed < <(FILE_URL="$url" python - <<'PY'
          from urllib.parse import urlparse, unquote
          import os

          parsed = urlparse(os.environ["FILE_URL"])
          host = (parsed.hostname or "").lower()
          path = parsed.path.lstrip("/")
          account = ""
          container = ""
          blob = ""
          is_blob = False
          if host.endswith(".blob.core.windows.net") and "/" in path:
              container, blob = path.split("/", 1)
              container = unquote(container)
              blob = unquote(blob)
              account = host.split(".", 1)[0]
              is_blob = bool(account and container and blob)
          print("azure-blob" if is_blob else "url")
          print(account)
          print(container)
          print(blob)
          PY
            )
            local download_method="${parsed[0]}"
            local account_name="${parsed[1]}"
            local container_name="${parsed[2]}"
            local blob_name="${parsed[3]}"

            if [ "$download_method" = "azure-blob" ]; then
              echo "Attempting Azure-authenticated download for $label from $account_name/$container_name/$blob_name"
              if az storage blob download \
                --auth-mode login \
                --account-name "$account_name" \
                --container-name "$container_name" \
                --name "$blob_name" \
                --file "$dest" \
                --overwrite true \
                --output none; then
                return 0
              fi
              if [ "$url" != "$MURL_PATH" ]; then
                echo "::warning::Azure-authenticated download failed for $label; retrying with the provided URL"
              else
                echo "::error::Azure-authenticated download failed for $label and no SAS/query fallback is available"
                return 1
              fi
            fi

            curl --fail-with-body -sSL -o "$dest" "$url"
          }

          download_with_auth_fallback "Video-MME manifest" "$MANIFEST_URL" "$STAGE_DIR/manifest.json"

      - name: Validate questions metadata
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from evaluation_foundry.benchmarks.video_mme.file_validation import validate_staged_dataset_file

          path = Path(os.environ["STAGE_DIR"]) / os.environ["QFILE"]
          inspection = validate_staged_dataset_file(path, label="Video-MME questions metadata")
          print(
              f"Validated {path.name}: detected={inspection.detected_format}, "
              f"size={inspection.size_bytes} bytes"
          )
          PY

      - name: Build ingest batch (full-pipeline)
        if: ${{ inputs.mode == 'full-pipeline' }}
        working-directory: backend
        env:
          SOURCE_PREFIX: ${{ inputs.source-prefix }}
          SOURCE_CONTAINER: ${{ inputs.source-container }}
          VMME_LIMIT: ${{ inputs.limit }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from evaluation_foundry.benchmarks.video_mme.ingest import _load_metadata, stratified_sample

          questions_path = Path(os.environ["STAGE_DIR"]) / os.environ["QFILE"]
          limit = int(os.environ["VMME_LIMIT"])
          sample_limit = None if limit == 0 else limit
          source_prefix = os.environ.get("SOURCE_PREFIX", "").strip("/")
          source_container = os.environ["SOURCE_CONTAINER"]

          records = _load_metadata(questions_path)
          sampled = stratified_sample(
              records,
              limit=sample_limit,
              stratify_by="duration_bucket",
              seed=42,
          )
          items = []
          for rec in sampled:
              blob_name = rec.filename
              if source_prefix:
                  blob_name = f"{source_prefix}/{blob_name}"
              items.append(
                  {
                      "benchmark_name": "video_mme",
                      "benchmark_video_id": rec.video_id,
                      "benchmark_split": rec.duration_bucket,
                      "source_container": source_container,
                      "source_blob_name": blob_name,
                      "original_filename": rec.filename,
                      "preset": "benchmark",
                  }
              )

          out_path = Path(os.environ["STAGE_DIR"]) / "ingest-batch.json"
          out_path.write_text(json.dumps({"videos": items}, indent=2), encoding="utf-8")
          print(f"Wrote {len(items)} ingest items to {out_path}")
          PY

      - name: Validate sampled source blobs (full-pipeline)
        if: ${{ inputs.mode == 'full-pipeline' }}
        env:
          VMME_LIMIT: ${{ inputs.limit }}
          PREFLIGHT_VALIDATION_SAMPLE_SIZE: 25
          QUESTIONS_URL: ${{ inputs.questions-url }}
          SOURCE_CONTAINER: ${{ inputs.source-container }}
          SOURCE_STORAGE_ACCOUNT: ${{ inputs.source-storage-account }}
        run: |
          RESOLVED_ACCOUNT=$(SOURCE_STORAGE_ACCOUNT="$SOURCE_STORAGE_ACCOUNT" QUESTIONS_URL_VALUE="$QUESTIONS_URL" python - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlparse

          BLOB_SUFFIX = ".blob.core.windows.net"
          ACCOUNT_RE = re.compile(r"^[a-z0-9]{3,24}$")


          def normalize(raw: str) -> str:
              value = (raw or "").strip()
              if not value:
                  return ""
              # Accept full URLs or scheme-less hostnames.
              candidate = value
              if "://" not in candidate and "/" in candidate:
                  candidate = candidate.split("/", 1)[0]
              if "://" in candidate or candidate.endswith(BLOB_SUFFIX):
                  parsed = urlparse(candidate if "://" in candidate else f"https://{candidate}")
                  host = (parsed.hostname or "").lower()
                  if host.endswith(BLOB_SUFFIX):
                      return host[: -len(BLOB_SUFFIX)].split(".", 1)[0]
                  print(
                      f"::error::source-storage-account '{value}' is not an Azure Blob endpoint. "
                      "Pass a storage account name (e.g., 'stqprismadev') or a *.blob.core.windows.net URL. "
                      "Do NOT pass the QPrisma API base URL.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              # Bare token: must look like a valid storage account name.
              lowered = candidate.lower()
              if not ACCOUNT_RE.match(lowered):
                  print(
                      f"::error::source-storage-account '{value}' is not a valid Azure Storage account name "
                      "(3-24 lowercase letters/digits) and is not a *.blob.core.windows.net URL.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              return lowered


          explicit = normalize(os.environ.get("SOURCE_STORAGE_ACCOUNT", ""))
          if explicit:
              print(explicit)
          else:
              host = (urlparse(os.environ.get("QUESTIONS_URL_VALUE", "")).hostname or "").lower()
              print(host[: -len(BLOB_SUFFIX)].split(".", 1)[0] if host.endswith(BLOB_SUFFIX) else "")
          PY
          )

          if [ -z "$RESOLVED_ACCOUNT" ]; then
            echo "::warning::Skipping source blob preflight because the storage account could not be resolved. Set source-storage-account when questions-url is not hosted on the same Azure Blob account."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          stage_dir = Path(os.environ["STAGE_DIR"])
          payload = json.loads((stage_dir / "ingest-batch.json").read_text(encoding="utf-8"))
          requested_limit = int(os.environ["VMME_LIMIT"])
          validation_cap = int(os.environ["PREFLIGHT_VALIDATION_SAMPLE_SIZE"])
          unique_blob_names = list(
              dict.fromkeys(
                  item["source_blob_name"]
                  for item in payload["videos"]
                  if item.get("source_blob_name")
              )
          )
          blob_names = unique_blob_names
          if requested_limit == 0 and len(unique_blob_names) > validation_cap:
              blob_names = unique_blob_names[:validation_cap]
              print(
                  f"Prepared {len(blob_names)} of {len(unique_blob_names)} unique source blobs "
                  "for preflight validation during full-set ingest."
              )
          else:
              print(f"Prepared {len(blob_names)} unique source blobs for preflight validation.")
          (stage_dir / "sampled-source-blobs.txt").write_text(
              ("\n".join(blob_names) + "\n") if blob_names else "",
              encoding="utf-8",
          )
          PY

          missing=()
          while IFS= read -r blob_name; do
            if [ -z "$blob_name" ]; then
              continue
            fi
            exists=$(az storage blob exists \
              --auth-mode login \
              --account-name "$RESOLVED_ACCOUNT" \
              --container-name "$SOURCE_CONTAINER" \
              --name "$blob_name" \
              --query exists \
              -o tsv)
            if [ "$exists" != "true" ]; then
              missing+=("$blob_name")
            fi
          done < "$STAGE_DIR/sampled-source-blobs.txt"

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Sampled source blobs are missing from ${RESOLVED_ACCOUNT}/${SOURCE_CONTAINER}"
            printf ' - %s\n' "${missing[@]:0:20}"
            if [ "${#missing[@]}" -gt 20 ]; then
              echo " ... and $((${#missing[@]} - 20)) more"
            fi
            exit 1
          fi

          echo "Validated $(wc -l < "$STAGE_DIR/sampled-source-blobs.txt") sampled source blobs in ${RESOLVED_ACCOUNT}/${SOURCE_CONTAINER}"

      - name: Call benchmark ingest API (full-pipeline)
        if: ${{ inputs.mode == 'full-pipeline' }}
        env:
          API_BASE_URL: ${{ inputs.api-base-url }}
          BENCHMARK_API_TOKEN: ${{ secrets.BENCHMARK_API_TOKEN }}
        run: |
          set +e
          HTTP_STATUS=$(curl -sS \
            -H "Content-Type: application/json" \
            -H "X-Benchmark-Token: ${BENCHMARK_API_TOKEN}" \
            -X POST \
            --data @"$STAGE_DIR/ingest-batch.json" \
            -o "$STAGE_DIR/ingest-response.json" \
            -w "%{http_code}" \
            "${API_BASE_URL%/}/benchmark/ingest/batch")
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::curl failed while calling the benchmark ingest API"
            if [ -s "$STAGE_DIR/ingest-response.json" ]; then
              cat "$STAGE_DIR/ingest-response.json"
            fi
            exit "$CURL_EXIT"
          fi

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Benchmark ingest API returned HTTP $HTTP_STATUS"
            if [ -s "$STAGE_DIR/ingest-response.json" ]; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["STAGE_DIR"]) / "ingest-response.json"
          raw = path.read_text(encoding="utf-8")
          try:
              print(json.dumps(json.loads(raw), indent=2))
          except json.JSONDecodeError:
              print(raw)
          PY
            else
              echo "::error::Benchmark ingest API returned no response body"
            fi
            exit 1
          fi

      - name: Poll benchmark ingest status (full-pipeline)
        if: ${{ inputs.mode == 'full-pipeline' }}
        env:
          API_BASE_URL: ${{ inputs.api-base-url }}
          BENCHMARK_API_TOKEN: ${{ secrets.BENCHMARK_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          stage_dir = Path(os.environ["STAGE_DIR"])
          response = json.loads((stage_dir / "ingest-response.json").read_text(encoding="utf-8"))
          video_ids = [item["benchmark_video_id"] for item in response["items"]]
          params = [("benchmark_name", "video_mme")]
          for video_id in video_ids:
              params.append(("benchmark_video_id", video_id))
          url = f"{os.environ['API_BASE_URL'].rstrip('/')}/benchmark/status?{urllib.parse.urlencode(params, doseq=True)}"
          deadline = time.time() + 60 * 90
          headers = {"X-Benchmark-Token": os.environ["BENCHMARK_API_TOKEN"]}

          while time.time() < deadline:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))
              (stage_dir / "status.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
              statuses = [item["processing_status"] for item in payload["items"]]
              if statuses and all(status == "completed" for status in statuses):
                  print("All benchmark videos completed")
                  break
              if any(status in {"failed", "error"} for status in statuses):
                  raise SystemExit(f"Benchmark ingest failed: {statuses}")
              print(f"Waiting for benchmark ingest to complete: {statuses}")
              time.sleep(30)
          else:
              raise SystemExit("Timed out waiting for benchmark ingest to complete")
          PY

      - name: Build manifest via benchmark API (full-pipeline)
        if: ${{ inputs.mode == 'full-pipeline' }}
        env:
          API_BASE_URL: ${{ inputs.api-base-url }}
          BENCHMARK_API_TOKEN: ${{ secrets.BENCHMARK_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          stage_dir = Path(os.environ["STAGE_DIR"])
          status_payload = json.loads((stage_dir / "status.json").read_text(encoding="utf-8"))
          body = json.dumps(
              {
                  "benchmark_name": "video_mme",
                  "benchmark_video_ids": [
                      item["benchmark_video_id"] for item in status_payload["items"]
                  ],
                  "version": "lmms-lab/Video-MME@main",
                  "response_format": "letter_only",
                  "agent_commit_sha": os.environ["GITHUB_SHA"],
              }
          ).encode("utf-8")
          req = urllib.request.Request(
              f"{os.environ['API_BASE_URL'].rstrip('/')}/benchmark/manifest",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "X-Benchmark-Token": os.environ["BENCHMARK_API_TOKEN"],
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              payload = json.loads(resp.read().decode("utf-8"))
          (stage_dir / "manifest.json").write_text(
              json.dumps(payload["manifest"], indent=2),
              encoding="utf-8",
          )
          PY

      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-mme-manifest
          path: ${{ runner.temp }}/vmme/manifest.json
          retention-days: 30
          if-no-files-found: warn

      - name: Emit Foundry eval data
        working-directory: backend
        run: |
          MODES="${{ inputs.subtitle-modes }}"
          python -m evaluation_foundry.benchmarks.video_mme.emit_foundry_data \
            --manifest "$STAGE_DIR/manifest.json" \
            --questions "$STAGE_DIR/$QFILE" \
            --subtitle-modes $MODES \
            --limit ${{ inputs.limit }} \
            --name video-mme \
            --evaluators qprisma.video_mme_mcq \
            --out "$STAGE_DIR/video-mme-eval.json"
          echo "Emitted $(jq '.data | length' "$STAGE_DIR/video-mme-eval.json") rows"

      - name: Register Video-MME custom evaluator
        working-directory: backend
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          python -m evaluation_foundry.register_evaluators

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup long-lived OIDC token refresh
        run: |
          TOKEN_FILE="${RUNNER_TEMP}/oidc-token"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$TOKEN_FILE"
          (
            while true; do
              sleep 240
              curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                | jq -r '.value' > "${TOKEN_FILE}.tmp" 2>/dev/null \
                && mv "${TOKEN_FILE}.tmp" "$TOKEN_FILE"
            done
          ) &
          echo "TOKEN_REFRESH_PID=$!" >> "$GITHUB_ENV"
          echo "AZURE_FEDERATED_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"

      - name: Run Video-MME evaluation
        id: eval-vmme
        continue-on-error: true
        uses: microsoft/ai-agent-evals@22a09a8f9dbc407e3a5429db9635111fb669f463
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          agent-ids: ${{ needs.resolve-version.outputs.agent-id }}
          data-path: ${{ runner.temp }}/vmme/video-mme-eval.json
          deployment-name: gpt-4o

      - name: Cleanup token refresh
        if: always()
        run: kill "$TOKEN_REFRESH_PID" 2>/dev/null || true

      - name: Upload Video-MME inputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-mme-inputs
          path: ${{ runner.temp }}/vmme/video-mme-eval.json
          retention-days: 30
          if-no-files-found: warn

      - name: Video-MME regression check (advisory)
        if: steps.eval-vmme.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: |
          mkdir -p ../docs/benchmarks
          python -m evaluation_foundry.scripts.check_vmme_regression \
            --results-dir "${{ runner.temp }}" \
            --history ../docs/benchmarks/vmme_history.json \
            --window 7 --threshold 0.03 \
            --append --sha "${{ github.sha }}"

      - name: Report evaluation outcome
        if: steps.eval-vmme.outcome == 'failure'
        run: |
          echo "::warning::Video-MME evaluation action failed. Results may still be available in the Azure AI Foundry portal."
          echo "Check: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/evaluations"
          exit 1
