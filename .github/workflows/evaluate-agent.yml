name: Evaluate Agent

run-name: Evaluate QPrisma Video Agent

on:
  workflow_dispatch:
    inputs:
      agent-version:
        description: 'Agent version override (e.g., "2"). Leave empty to auto-resolve.'
        required: false
        type: string
      run-redteam:
        description: 'Run cloud Foundry AI Red Teaming scan (direct-attack / jailbreak coverage).'
        required: false
        type: boolean
        default: false
      run-video-mme:
        description: 'Run Video-MME benchmark evaluation (requires manifest + questions staged in Blob Storage).'
        required: false
        type: boolean
        default: false
      video-mme-manifest-url:
        description: 'HTTPS/SAS URL to download the Video-MME manifest.json (produced by ingest.py). Required when run-video-mme=true.'
        required: false
        type: string
      video-mme-questions-url:
        description: 'HTTPS/SAS URL to download the Video-MME questions parquet/jsonl. Required when run-video-mme=true.'
        required: false
        type: string
      video-mme-limit:
        description: 'Cap rows for the Video-MME run (0 = full set, stratified by duration_bucket).'
        required: false
        type: number
        default: 50
      video-mme-subtitle-modes:
        description: 'Subtitle modes to evaluate.'
        required: false
        type: choice
        options:
          - 'with without'
          - 'with'
          - 'without'
        default: 'with without'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-eval
  cancel-in-progress: true

env:
  AGENT_NAME: qprisma-video-agent
  FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}

jobs:
  # ------------------------------------------------------------------
  # Job 1: Generate evaluation data files from templates + env config
  # ------------------------------------------------------------------
  generate-data:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate evaluation data
        id: gen
        working-directory: backend
        env:
          EVAL_MEDIA_ID_1: ${{ vars.EVAL_MEDIA_ID_1 }}
          EVAL_MEDIA_ID_2: ${{ vars.EVAL_MEDIA_ID_2 }}
          EVAL_USER_ID: ${{ secrets.EVAL_USER_ID }}
          # F2: reproducibility metadata captured into run-metadata.json
          AGENT_NAME: ${{ env.AGENT_NAME }}
          AGENT_VERSION_OVERRIDE: ${{ inputs.agent-version }}
          EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'gpt-4o' }}
          EVAL_JUDGE_TEMPERATURE: ${{ vars.EVAL_JUDGE_TEMPERATURE || '0.0' }}
          EVAL_JUDGE_N_RUNS: ${{ vars.EVAL_JUDGE_N_RUNS || '1' }}
          EVAL_FRAME_SAMPLING_FPS: ${{ vars.EVAL_FRAME_SAMPLING_FPS }}
          EVAL_MAX_FRAMES: ${{ vars.EVAL_MAX_FRAMES }}
          EVAL_SUBTITLE_MODE: ${{ vars.EVAL_SUBTITLE_MODE }}
        run: |
          python -m evaluation_foundry.generate_eval_data \
            --output-dir "${{ runner.temp }}/eval-data"

      - name: Upload eval data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-data
          path: ${{ runner.temp }}/eval-data/
          retention-days: 30

  # ------------------------------------------------------------------
  # Job 2: Resolve agent version
  # ------------------------------------------------------------------
  resolve-version:
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      agent-id: ${{ steps.resolve.outputs.agent_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install SDK
        run: pip install "azure-ai-projects==2.0.1" "azure-identity==1.25.0"

      - name: Resolve agent version
        id: resolve
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AGENT_NAME: ${{ env.AGENT_NAME }}
        run: |
          if [ -n "${{ inputs.agent-version }}" ]; then
            AGENT_ID="${AGENT_NAME}:${{ inputs.agent-version }}"
            echo "Using manual override: ${AGENT_ID}"
            echo "agent_id=${AGENT_ID}" >> $GITHUB_OUTPUT
          else
            python scripts/resolve_agent_version.py
          fi

  # ------------------------------------------------------------------
  # Job 3: Quality evaluation (text quality — coherence, fluency, etc.)
  # ------------------------------------------------------------------
  evaluate-quality:
    runs-on: ubuntu-latest
    needs: [generate-data, resolve-version]
    environment: dev
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Long-running evaluations can exceed the Azure CLI token lifetime
      # (~1 hour). This step creates a continuously-refreshed OIDC token
      # file so DefaultAzureCredential → WorkloadIdentityCredential can
      # obtain fresh access tokens throughout the evaluation polling phase.
      - name: Setup long-lived OIDC token refresh
        run: |
          TOKEN_FILE="${RUNNER_TEMP}/oidc-token"

          # Fetch initial OIDC token from GitHub Actions runtime
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$TOKEN_FILE"

          # Background refresh every 4 minutes (OIDC assertions expire in 5 min)
          (
            while true; do
              sleep 240
              curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                | jq -r '.value' > "${TOKEN_FILE}.tmp" 2>/dev/null \
                && mv "${TOKEN_FILE}.tmp" "$TOKEN_FILE"
            done
          ) &
          echo "TOKEN_REFRESH_PID=$!" >> "$GITHUB_ENV"

          # WorkloadIdentityCredential env vars (tried before AzureCliCredential)
          echo "AZURE_FEDERATED_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"

      - name: Download eval data
        uses: actions/download-artifact@v4
        with:
          name: eval-data
          path: ${{ runner.temp }}/eval-data

      - name: Run quality evaluation
        id: eval-quality
        continue-on-error: true
        # Pinned to v3-beta @ 22a09a8f9dbc407e3a5429db9635111fb669f463 for benchmark reproducibility (F1)
        uses: microsoft/ai-agent-evals@22a09a8f9dbc407e3a5429db9635111fb669f463
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          agent-ids: ${{ needs.resolve-version.outputs.agent-id }}
          data-path: ${{ runner.temp }}/eval-data/quality-eval.json
          deployment-name: gpt-4o

      - name: Cleanup token refresh
        if: always()
        run: kill "$TOKEN_REFRESH_PID" 2>/dev/null || true

      - name: Report evaluation outcome
        if: steps.eval-quality.outcome == 'failure'
        run: |
          echo "::warning::Quality evaluation action failed. Results may still be available in the Azure AI Foundry portal."
          echo "Check: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/evaluations"
          exit 1

  # ------------------------------------------------------------------
  # Job 4: Agent/tool evaluation (tool selection, accuracy, etc.)
  # ------------------------------------------------------------------
  evaluate-agent:
    runs-on: ubuntu-latest
    needs: [generate-data, resolve-version]
    environment: dev
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup long-lived OIDC token refresh
        run: |
          TOKEN_FILE="${RUNNER_TEMP}/oidc-token"

          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$TOKEN_FILE"

          (
            while true; do
              sleep 240
              curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                | jq -r '.value' > "${TOKEN_FILE}.tmp" 2>/dev/null \
                && mv "${TOKEN_FILE}.tmp" "$TOKEN_FILE"
            done
          ) &
          echo "TOKEN_REFRESH_PID=$!" >> "$GITHUB_ENV"

          echo "AZURE_FEDERATED_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"

      - name: Download eval data
        uses: actions/download-artifact@v4
        with:
          name: eval-data
          path: ${{ runner.temp }}/eval-data

      - name: Run agent evaluation
        id: eval-agent
        continue-on-error: true
        # Pinned to v3-beta @ 22a09a8f9dbc407e3a5429db9635111fb669f463 for benchmark reproducibility (F1)
        uses: microsoft/ai-agent-evals@22a09a8f9dbc407e3a5429db9635111fb669f463
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          agent-ids: ${{ needs.resolve-version.outputs.agent-id }}
          data-path: ${{ runner.temp }}/eval-data/agent-eval.json
          deployment-name: gpt-4o

      - name: Cleanup token refresh
        if: always()
        run: kill "$TOKEN_REFRESH_PID" 2>/dev/null || true

      - name: Report evaluation outcome
        if: steps.eval-agent.outcome == 'failure'
        run: |
          echo "::warning::Agent evaluation action failed. Results may still be available in the Azure AI Foundry portal."
          echo "Check: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/evaluations"
          exit 1

  # ------------------------------------------------------------------
  # Job 5: Safety evaluation (adversarial queries)
  # ------------------------------------------------------------------
  evaluate-safety:
    runs-on: ubuntu-latest
    needs: [generate-data, resolve-version]
    environment: dev
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup long-lived OIDC token refresh
        run: |
          TOKEN_FILE="${RUNNER_TEMP}/oidc-token"

          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$TOKEN_FILE"

          (
            while true; do
              sleep 240
              curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                | jq -r '.value' > "${TOKEN_FILE}.tmp" 2>/dev/null \
                && mv "${TOKEN_FILE}.tmp" "$TOKEN_FILE"
            done
          ) &
          echo "TOKEN_REFRESH_PID=$!" >> "$GITHUB_ENV"

          echo "AZURE_FEDERATED_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"

      - name: Download eval data
        uses: actions/download-artifact@v4
        with:
          name: eval-data
          path: ${{ runner.temp }}/eval-data

      - name: Run safety evaluation
        id: eval-safety
        continue-on-error: true
        # Pinned to v3-beta @ 22a09a8f9dbc407e3a5429db9635111fb669f463 for benchmark reproducibility (F1)
        uses: microsoft/ai-agent-evals@22a09a8f9dbc407e3a5429db9635111fb669f463
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          agent-ids: ${{ needs.resolve-version.outputs.agent-id }}
          data-path: ${{ runner.temp }}/eval-data/safety-eval.json
          deployment-name: gpt-4o

      - name: Cleanup token refresh
        if: always()
        run: kill "$TOKEN_REFRESH_PID" 2>/dev/null || true

      - name: Report evaluation outcome
        if: steps.eval-safety.outcome == 'failure'
        run: |
          echo "::warning::Safety evaluation action failed. Results may still be available in the Azure AI Foundry portal."
          echo "Check: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/evaluations"
          exit 1

  # ------------------------------------------------------------------
  # Job 6: Cloud AI Red Teaming scan (direct-attack / jailbreak coverage)
  # ------------------------------------------------------------------
  # Only runs when the manual workflow is dispatched with
  # `run-redteam=true` so red-team cost remains explicit.
  redteam-eval:
    runs-on: ubuntu-latest
    needs: [resolve-version]
    environment: dev
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run-redteam == true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup long-lived OIDC token refresh
        run: |
          TOKEN_FILE="${RUNNER_TEMP}/oidc-token"

          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$TOKEN_FILE"

          (
            while true; do
              sleep 240
              curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                | jq -r '.value' > "${TOKEN_FILE}.tmp" 2>/dev/null \
                && mv "${TOKEN_FILE}.tmp" "$TOKEN_FILE"
            done
          ) &
          echo "TOKEN_REFRESH_PID=$!" >> "$GITHUB_ENV"

          echo "AZURE_FEDERATED_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"

      - name: Install Red Team SDK
        run: |
          pip install "azure-ai-projects==2.0.1" "azure-identity==1.25.0"

      - name: Run AI Red Teaming scan
        id: redteam
        continue-on-error: true
        working-directory: backend
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT || 'gpt-4o' }}
          QPRISMA_REDTEAM_NUM_TURNS: '5'
        run: |
          python -m evaluation_foundry.redteam_eval \
            --agent-id "${{ needs.resolve-version.outputs.agent-id }}" \
            --endpoint "${{ vars.FOUNDRY_PROJECT_ENDPOINT }}" \
            --model-deployment "${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT || 'gpt-4o' }}" \
            --strategies "base64,flip,indirect_jailbreak" \
            --risk-categories "prohibited_actions" \
            --output "${{ runner.temp }}/redteam-results.json" \
            --scan-name "qprisma-${{ needs.resolve-version.outputs.agent-id }}-redteam"

      - name: Cleanup token refresh
        if: always()
        run: kill "$TOKEN_REFRESH_PID" 2>/dev/null || true

      - name: Upload red-team results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results
          path: ${{ runner.temp }}/redteam-results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Report red-team outcome
        if: steps.redteam.outcome == 'failure'
        run: |
          echo "::warning::Red Team scan failed. Partial results (if any) were uploaded as an artifact."
          echo "Check: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/evaluations"
          exit 1

  # ------------------------------------------------------------------
  # Job 7: Video-MME benchmark evaluation (industry MCQ benchmark)
  # ------------------------------------------------------------------
  # Only runs when `run-video-mme=true` is dispatched. Operator must
  # stage the manifest.json (produced by `ingest.py`) and the Video-MME
  # questions parquet to a Blob Storage container and pass SAS URLs.
  # See: docs/EVALUATION_GUIDE.md
  evaluate-video-mme:
    runs-on: ubuntu-latest
    needs: [resolve-version]
    environment: dev
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run-video-mme == true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.video-mme-manifest-url }}" ] || [ -z "${{ inputs.video-mme-questions-url }}" ]; then
            echo "::error::run-video-mme=true requires video-mme-manifest-url and video-mme-questions-url"
            exit 1
          fi

      - name: Install Video-MME emitter deps
        working-directory: backend
        run: |
          pip install pandas pyarrow

      - name: Download manifest + questions
        env:
          MANIFEST_URL: ${{ inputs.video-mme-manifest-url }}
          QUESTIONS_URL: ${{ inputs.video-mme-questions-url }}
        run: |
          STAGE_DIR="${RUNNER_TEMP}/vmme"
          mkdir -p "$STAGE_DIR"

          download_with_auth_fallback() {
            local label="$1"
            local url="$2"
            local dest="$3"
            local url_path="${url%%?*}"
            local parsed=()
            readarray -t parsed < <(FILE_URL="$url" python - <<'PY'
          from urllib.parse import urlparse, unquote
          import os

          parsed = urlparse(os.environ["FILE_URL"])
          host = (parsed.hostname or "").lower()
          path = parsed.path.lstrip("/")
          account = ""
          container = ""
          blob = ""
          is_blob = False
          if host.endswith(".blob.core.windows.net") and "/" in path:
              container, blob = path.split("/", 1)
              container = unquote(container)
              blob = unquote(blob)
              account = host.split(".", 1)[0]
              is_blob = bool(account and container and blob)
          print("azure-blob" if is_blob else "url")
          print(account)
          print(container)
          print(blob)
          PY
            )
            local download_method="${parsed[0]}"
            local account_name="${parsed[1]}"
            local container_name="${parsed[2]}"
            local blob_name="${parsed[3]}"

            if [ "$download_method" = "azure-blob" ]; then
              echo "Attempting Azure-authenticated download for $label from $account_name/$container_name/$blob_name"
              if az storage blob download \
                --auth-mode login \
                --account-name "$account_name" \
                --container-name "$container_name" \
                --name "$blob_name" \
                --file "$dest" \
                --overwrite true \
                --output none; then
                return 0
              fi
              if [ "$url" != "$url_path" ]; then
                echo "::warning::Azure-authenticated download failed for $label; retrying with the provided URL"
              else
                echo "::error::Azure-authenticated download failed for $label and no SAS/query fallback is available"
                return 1
              fi
            fi

            curl --fail-with-body -sSL -o "$dest" "$url"
          }

          download_with_auth_fallback "Video-MME manifest" "$MANIFEST_URL" "$STAGE_DIR/manifest.json"
          # Try to preserve extension by sniffing URL path before query string
          QURL_PATH="${QUESTIONS_URL%%?*}"
          case "$QURL_PATH" in
            *.parquet) QFILE="questions.parquet" ;;
            *.jsonl)   QFILE="questions.jsonl" ;;
            *.json)    QFILE="questions.json" ;;
            *)         QFILE="questions.parquet" ;;
          esac
          download_with_auth_fallback "Video-MME questions file" "$QUESTIONS_URL" "$STAGE_DIR/$QFILE"
          echo "STAGE_DIR=$STAGE_DIR" >> "$GITHUB_ENV"
          echo "QFILE=$QFILE" >> "$GITHUB_ENV"
          echo "Manifest size: $(wc -c <"$STAGE_DIR/manifest.json") bytes"
          echo "Questions size: $(wc -c <"$STAGE_DIR/$QFILE") bytes"

      - name: Validate Video-MME questions
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from evaluation_foundry.benchmarks.video_mme.file_validation import validate_staged_dataset_file

          path = Path(os.environ["STAGE_DIR"]) / os.environ["QFILE"]
          inspection = validate_staged_dataset_file(path, label="Video-MME questions file")
          print(
              f"Validated {path.name}: detected={inspection.detected_format}, "
              f"size={inspection.size_bytes} bytes"
          )
          PY

      - name: Emit Foundry eval data
        working-directory: backend
        run: |
          MODES="${{ inputs.video-mme-subtitle-modes }}"
          python -m evaluation_foundry.benchmarks.video_mme.emit_foundry_data \
            --manifest "$STAGE_DIR/manifest.json" \
            --questions "$STAGE_DIR/$QFILE" \
            --subtitle-modes $MODES \
            --limit ${{ inputs.video-mme-limit }} \
            --name video-mme \
            --evaluators qprisma.video_mme_mcq \
            --out "$STAGE_DIR/video-mme-eval.json"
          echo "Emitted $(jq '.data | length' "$STAGE_DIR/video-mme-eval.json") rows"

      - name: Register Video-MME custom evaluator
        working-directory: backend
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        run: |
          pip install "azure-ai-projects==2.0.1" "azure-identity==1.25.0"
          python -m evaluation_foundry.register_evaluators

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup long-lived OIDC token refresh
        run: |
          TOKEN_FILE="${RUNNER_TEMP}/oidc-token"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$TOKEN_FILE"
          (
            while true; do
              sleep 240
              curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                | jq -r '.value' > "${TOKEN_FILE}.tmp" 2>/dev/null \
                && mv "${TOKEN_FILE}.tmp" "$TOKEN_FILE"
            done
          ) &
          echo "TOKEN_REFRESH_PID=$!" >> "$GITHUB_ENV"
          echo "AZURE_FEDERATED_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"

      - name: Run Video-MME evaluation
        id: eval-vmme
        continue-on-error: true
        # Pinned to v3-beta @ 22a09a8f9dbc407e3a5429db9635111fb669f463 for benchmark reproducibility (F1)
        uses: microsoft/ai-agent-evals@22a09a8f9dbc407e3a5429db9635111fb669f463
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          agent-ids: ${{ needs.resolve-version.outputs.agent-id }}
          data-path: ${{ runner.temp }}/vmme/video-mme-eval.json
          deployment-name: gpt-4o

      - name: Cleanup token refresh
        if: always()
        run: kill "$TOKEN_REFRESH_PID" 2>/dev/null || true

      - name: Upload Video-MME inputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-mme-inputs
          path: ${{ runner.temp }}/vmme/video-mme-eval.json
          retention-days: 30
          if-no-files-found: warn

      - name: Video-MME regression check (advisory)
        # V5: best-effort regression alert on accuracy_long. Always advisory
        # (exit 0 unless --strict). The script discovers the action's result
        # file under runner.temp; if no parseable result is found it writes
        # an info row to the step summary and returns cleanly.
        if: steps.eval-vmme.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        run: |
          mkdir -p ../docs/benchmarks
          python -m evaluation_foundry.scripts.check_vmme_regression \
            --results-dir "${{ runner.temp }}" \
            --history ../docs/benchmarks/vmme_history.json \
            --window 7 --threshold 0.03 \
            --append --sha "${{ github.sha }}"

      - name: Report evaluation outcome
        if: steps.eval-vmme.outcome == 'failure'
        run: |
          echo "::warning::Video-MME evaluation action failed. Results may still be available in the Azure AI Foundry portal."
          echo "Check: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}/evaluations"
          exit 1
