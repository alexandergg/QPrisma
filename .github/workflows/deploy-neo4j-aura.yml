name: Deploy Neo4j AuraDB

run-name: "Neo4j AuraDB: ${{ inputs.action }} (${{ inputs.instance_type }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev]
      instance_type:
        description: 'AuraDB instance type'
        required: true
        default: 'professional-db'
        type: choice
        options:
          - professional-db
          - free-db
      action:
        description: 'Action to perform'
        required: true
        default: 'provision'
        type: choice
        options:
          - provision
          - pause
          - resume

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "${{ inputs.action }} AuraDB instance"
        id: aura
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 2
          retry_wait_seconds: 60
          command: python scripts/deploy_neo4j_aura.py
        env:
          AURA_CLIENT_ID: ${{ secrets.AURA_CLIENT_ID }}
          AURA_CLIENT_SECRET: ${{ secrets.AURA_CLIENT_SECRET }}
          AURA_TENANT_ID: ${{ secrets.AURA_TENANT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          AURA_INSTANCE_TYPE: ${{ inputs.instance_type }}
          AURA_ACTION: ${{ inputs.action }}

      - name: Mask sensitive outputs
        if: steps.aura.outputs.neo4j_password
        run: echo "::add-mask::${{ steps.aura.outputs.neo4j_password }}"

      - name: Deployment summary
        run: |
          echo "## Neo4j AuraDB — ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Instance | qprisma-graph-${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ inputs.instance_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ inputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Created | ${{ steps.aura.outputs.instance_created || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Instance ID | ${{ steps.aura.outputs.neo4j_instance_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URI | ${{ steps.aura.outputs.neo4j_uri || 'N/A (paused)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.aura.outputs.instance_created }}" = "true" ]; then
            echo "> **Action required:** Set the following GitHub secrets:" >> $GITHUB_STEP_SUMMARY
            echo "> - \`NEO4J_URI\` = \`${{ steps.aura.outputs.neo4j_uri }}\`" >> $GITHUB_STEP_SUMMARY
            echo "> - \`NEO4J_PASSWORD\` = (check workflow logs for masked password)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.action }}" = "pause" ]; then
            echo "> Instance paused. Compute billing stopped (~80% savings)." >> $GITHUB_STEP_SUMMARY
            echo "> Data and backups are retained. Resume when needed." >> $GITHUB_STEP_SUMMARY
          fi
