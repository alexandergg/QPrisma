name: Deploy AI Foundry

on:
  push:
    branches: [main]
    paths:
      - 'infra/modules/ai-foundry.bicep'
      - 'infra/parameters/ai-foundry-dev.bicepparam'
  workflow_dispatch:

concurrency:
  group: deploy-ai-foundry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location "westeurope" \
            --output none

      - name: Resolve storage account
        id: storage
        run: |
          STORAGE_NAME="stqprismadev"
          STORAGE_ID=$(az storage account show \
            --name "$STORAGE_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "id" -o tsv 2>/dev/null || echo "")
          echo "id=$STORAGE_ID" >> $GITHUB_OUTPUT
          echo "name=$STORAGE_NAME" >> $GITHUB_OUTPUT
          if [ -z "$STORAGE_ID" ]; then
            echo "::warning::Storage account not found. CapabilityHost will use Azure-managed defaults."
          fi

      - name: Delete existing capability host (update not supported)
        run: |
          echo "Deleting existing capability host to allow recreation with new config..."
          az rest --method DELETE \
            --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.CognitiveServices/accounts/aif-qprisma-dev/capabilityHosts/agents-host?api-version=2025-10-01-preview" \
            2>/dev/null || echo "No existing capability host found (OK)"
          echo "Waiting 30s for deletion to propagate..."
          sleep 30

      - name: Deploy AI Foundry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 60
          command: |
            az deployment group create \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file infra/modules/ai-foundry.bicep \
              --parameters infra/parameters/ai-foundry-dev.bicepparam \
              --parameters \
                storageAccountId='${{ steps.storage.outputs.id }}' \
                storageAccountName='${{ steps.storage.outputs.name }}'

      - name: Deployment summary
        run: |
          echo "## AI Foundry Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| AI Foundry | aif-qprisma-dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Location | swedencentral |" >> $GITHUB_STEP_SUMMARY
          echo "| Models | gpt-4o, gpt-5.2-chat, text-embedding-3-large, whisper, gpt-4o-batch |" >> $GITHUB_STEP_SUMMARY
          echo "| Capability Host | agents-host (Agents managed environment) |" >> $GITHUB_STEP_SUMMARY
