name: Deploy AI Foundry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ai-foundry.yml'
      - 'infra/modules/ai-foundry.bicep'
      - 'infra/parameters/ai-foundry-dev.bicepparam'
  workflow_dispatch:

concurrency:
  group: deploy-ai-foundry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location "westeurope" \
            --output none

      - name: Resolve storage account
        id: storage
        run: |
          STORAGE_NAME="stqprismadev"
          STORAGE_ID=$(az storage account show \
            --name "$STORAGE_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "id" -o tsv 2>/dev/null || echo "")
          echo "id=$STORAGE_ID" >> $GITHUB_OUTPUT
          echo "name=$STORAGE_NAME" >> $GITHUB_OUTPUT
          if [ -z "$STORAGE_ID" ]; then
            echo "::warning::Storage account not found. CapabilityHost will use Azure-managed defaults."
          fi

      - name: Resolve App Insights and Log Analytics
        id: observability
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APPI_NAME="appi-qprisma-dev"
          LOG_NAME="log-qprisma-dev"

          APPI_ID=$(az monitor app-insights component show \
            --app "$APPI_NAME" --resource-group "$RG" \
            --query "id" -o tsv 2>/dev/null || echo "")
          echo "app_insights_id=$APPI_ID" >> $GITHUB_OUTPUT

          APPI_CONN=$(az monitor app-insights component show \
            --app "$APPI_NAME" --resource-group "$RG" \
            --query "connectionString" -o tsv 2>/dev/null || echo "")
          APPI_KEY=$(az monitor app-insights component show \
            --app "$APPI_NAME" --resource-group "$RG" \
            --query "instrumentationKey" -o tsv 2>/dev/null || echo "")
          if [ -z "$APPI_KEY" ] && [ -n "$APPI_ID" ]; then
            echo "::warning::App Insights instrumentation key not retrievable. Foundry tracing connection will be skipped."
          fi
          if [ -n "$APPI_CONN" ]; then
            echo "::add-mask::$APPI_CONN"
          fi
          if [ -n "$APPI_KEY" ]; then
            echo "::add-mask::$APPI_KEY"
          fi
          echo "app_insights_connection_string=$APPI_CONN" >> $GITHUB_OUTPUT
          echo "app_insights_instrumentation_key=$APPI_KEY" >> $GITHUB_OUTPUT

          LOG_ID=$(az monitor log-analytics workspace show \
            --workspace-name "$LOG_NAME" --resource-group "$RG" \
            --query "id" -o tsv 2>/dev/null || echo "")
          echo "log_analytics_id=$LOG_ID" >> $GITHUB_OUTPUT

          if [ -z "$APPI_ID" ]; then
            echo "::warning::App Insights not found. Foundry tracing connection will be skipped."
          else
            echo "App Insights resolved: ${APPI_ID}"
          fi

      # NOTE: Capability host updates are NOT supported by Azure API.
      # If the host config needs to change, manually delete and recreate:
      #   1. Azure AI Foundry portal → Project → Hosted Agents
      #   2. For each agent version: delete its deployment first, then delete the version
      #   3. Delete the agent itself: az cognitiveservices agent delete --account-name aif-qprisma-dev --project-name aif-qprisma-dev-project --name <agent>
      #   4. Delete capability host: az rest --method DELETE --url ".../capabilityHosts/agents-host?api-version=2025-10-01-preview"
      #   5. Re-run this workflow to recreate with new config

      - name: Deploy AI Foundry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 60
          command: |
            az deployment group create \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file infra/modules/ai-foundry.bicep \
              --parameters infra/parameters/ai-foundry-dev.bicepparam \
              --parameters \
                storageAccountId='${{ steps.storage.outputs.id }}' \
                storageAccountName='${{ steps.storage.outputs.name }}' \
                appInsightsId='${{ steps.observability.outputs.app_insights_id }}' \
                appInsightsConnectionString='${{ steps.observability.outputs.app_insights_connection_string }}' \
                appInsightsInstrumentationKey='${{ steps.observability.outputs.app_insights_instrumentation_key }}' \
                logAnalyticsWorkspaceId='${{ steps.observability.outputs.log_analytics_id }}' \
              --output none

      - name: Deployment summary
        run: |
          echo "## AI Foundry Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| AI Foundry | aif-qprisma-dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Location | swedencentral |" >> $GITHUB_STEP_SUMMARY
          echo "| Models | gpt-4o, gpt-5.4-pro, gpt-5.3-chat, text-embedding-3-large, whisper, gpt-4o-batch |" >> $GITHUB_STEP_SUMMARY
          echo "| Capability Host | agents-host (Agents managed environment) |" >> $GITHUB_STEP_SUMMARY
          echo "| App Insights | ${{ steps.observability.outputs.app_insights_id && 'Connected' || 'Not configured' }} |" >> $GITHUB_STEP_SUMMARY
