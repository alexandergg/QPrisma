name: Deploy Hosted Agent

run-name: Deploy hosted agent to Foundry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hosted-agent.yml'
      - 'backend/agent/**'
      - 'backend/core/**'
      - 'backend/services/**'
      - 'backend/models/**'
      - 'infra/modules/ai-foundry.bicep'
      - 'infra/parameters/ai-foundry-dev.bicepparam'
      - 'scripts/deploy_agent.py'
  workflow_dispatch:
    inputs:
      chat_deployment:
        description: >-
          Azure OpenAI chat deployment name to use for the hosted video agent.
          Must already be provisioned in Foundry by deploy-ai-foundry.yml.
          Switch models for A/B tests by re-running this workflow with a different value
          (e.g. gpt-4o, gpt-5.4-pro). Falls back to the AZURE_OPENAI_DEPLOYMENT_GPT
          repository variable, then to gpt-5.4-pro.
        required: false
        type: string
        default: gpt-5.4-pro
      purge_before_deploy:
        description: >-
          Delete the existing 'qprisma-video-agent' (and ALL its versions) before
          registering a new one. Use this after major SDK migrations or when the
          version history is cluttered. Safe to leave off for routine deploys.
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-dev
  cancel-in-progress: false

env:
  IMAGE_NAME: qprisma-video-agent
  ACR_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  deploy-hosted-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${ACR_SERVER%%.*}"

      - name: Build and push agent image
        working-directory: backend
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          FULL_IMAGE="${ACR_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${ACR_SERVER}/${IMAGE_NAME}:latest"

          echo "Building ${FULL_IMAGE}"
          docker build \
            --platform linux/amd64 \
            -f agent/hosted/Dockerfile \
            -t "${FULL_IMAGE}" \
            -t "${LATEST_IMAGE}" \
            .

          docker push "${FULL_IMAGE}"
          docker push "${LATEST_IMAGE}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "FULL_IMAGE=${FULL_IMAGE}" >> $GITHUB_ENV

      - name: Install SDK dependencies
        run: pip install "azure-ai-projects==2.1.0" "azure-identity>=1.25.0"

      - name: Ensure ACR pull access for Foundry
        run: |
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          RG="rg-qprisma-dev"
          ACCOUNT="aif-qprisma-dev"
          ACR_ID=$(az acr show --name "${ACR_SERVER%%.*}" --query id -o tsv)
          echo "ACR resource ID: ${ACR_ID}"

          echo "Granting AcrPull to AI Foundry identities on ACR..."

          # Get AI Foundry account principal ID
          ACCOUNT_PID=$(az cognitiveservices account show \
            --name ${ACCOUNT} --resource-group ${RG} \
            --query identity.principalId -o tsv)
          echo "  Account principal: ${ACCOUNT_PID:0:8}..."

          # Get AI Foundry project principal ID
          PROJECT_PID=$(az rest --method GET \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.CognitiveServices/accounts/${ACCOUNT}/projects/${ACCOUNT}-project?api-version=2025-06-01" \
            --query identity.principalId -o tsv)
          echo "  Project principal: ${PROJECT_PID:0:8}..."

          # AcrPull built-in role (verified from Azure RBAC docs)
          ACR_PULL_ROLE="7f951dda-4ed3-4680-a7ca-43fe172d538d"

          for PID in $ACCOUNT_PID $PROJECT_PID; do
            if [ -n "$PID" ]; then
              echo "  Assigning AcrPull to principal: ${PID:0:8}..."
              az role assignment create \
                --assignee-object-id "$PID" \
                --assignee-principal-type ServicePrincipal \
                --role "$ACR_PULL_ROLE" \
                --scope "$ACR_ID" \
                --output none 2>&1 || echo "    (already assigned)"
            fi
          done

          # Verify assignments exist
          echo "Verifying AcrPull assignments..."
          az role assignment list --scope "$ACR_ID" --role "AcrPull" --query "[].{principal:principalId,type:principalType}" -o table
          echo "ACR access configured"

      - name: Ensure deployer has required RBAC roles
        run: |
          RG="rg-qprisma-dev"
          ACCOUNT="aif-qprisma-dev"

          # Get the OIDC service principal object ID
          DEPLOYER_PID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          echo "Deployer principal: ${DEPLOYER_PID:0:8}..."

          # AI Foundry account resource ID
          AI_ACCOUNT_ID=$(az cognitiveservices account show \
            --name ${ACCOUNT} --resource-group ${RG} \
            --query id -o tsv)

          # Roles required for hosted agent deployment:
          #   Azure AI Developer  — control-plane + OpenAI/Speech/ContentSafety data actions
          #   Cognitive Services User — wildcard data action (Microsoft.CognitiveServices/*)
          #     which covers AIServices/agents/write needed by AIProjectClient
          declare -A ROLES=(
            ["Azure AI Developer"]="64702f94-c441-49e6-a78b-ef80e0188fee"
            ["Cognitive Services User"]="a97b65f3-24c7-4388-baec-2e87135dc908"
          )

          NEED_WAIT=false
          for ROLE_NAME in "${!ROLES[@]}"; do
            ROLE_ID="${ROLES[$ROLE_NAME]}"
            echo "Assigning ${ROLE_NAME} on AI Foundry account..."
            RESULT=$(az role assignment create \
              --assignee-object-id "$DEPLOYER_PID" \
              --assignee-principal-type ServicePrincipal \
              --role "$ROLE_ID" \
              --scope "$AI_ACCOUNT_ID" \
              --output json 2>&1) && CREATED=true || CREATED=false

            if echo "$RESULT" | grep -q "already exists"; then
              echo "  ${ROLE_NAME}: already assigned"
            elif [ "$CREATED" = true ]; then
              echo "  ${ROLE_NAME}: newly assigned"
              NEED_WAIT=true
            else
              echo "  ${ROLE_NAME}: (result: $RESULT)"
            fi
          done

          if [ "$NEED_WAIT" = true ]; then
            echo "New role(s) assigned — waiting 120s for RBAC propagation..."
            sleep 120
          else
            echo "All roles already assigned — no wait needed"
          fi
          echo "RBAC roles configured"

      - name: Ensure deployer has Azure AI Project Manager on project
        run: |
          RG="rg-qprisma-dev"
          ACCOUNT="aif-qprisma-dev"
          PROJECT_NAME="${ACCOUNT}-project"
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          # Per official "hosted-agent-permissions" docs, Azure AI Developer
          # is INSUFFICIENT for hosted agent scenarios. The deployer SP needs
          # Azure AI Project Manager at PROJECT scope so the platform can
          # automatically assign Azure AI User to the freshly created agent
          # instance identity. Without this, identity provisioning stalls and
          # instance_identity.principal_id is never returned.
          DEPLOYER_PID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          PROJECT_SCOPE="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.CognitiveServices/accounts/${ACCOUNT}/projects/${PROJECT_NAME}"

          # Verify the built-in role exists exactly once before assigning by name.
          # Filter on roleName to avoid order-dependent matches when listing.
          PM_ROLE_MATCHES=$(az role definition list \
            --query "[?roleName=='Azure AI Project Manager'].name" -o tsv 2>/dev/null | wc -l | tr -d ' ')
          if [ "$PM_ROLE_MATCHES" != "1" ]; then
            echo "::error::Expected exactly one 'Azure AI Project Manager' role definition, found ${PM_ROLE_MATCHES}. Check tenant role definitions."
            exit 1
          fi

          echo "Assigning Azure AI Project Manager on project scope to deployer ${DEPLOYER_PID:0:8}..."
          RESULT=$(az role assignment create \
            --assignee-object-id "$DEPLOYER_PID" \
            --assignee-principal-type ServicePrincipal \
            --role "Azure AI Project Manager" \
            --scope "$PROJECT_SCOPE" \
            --output json 2>&1) && CREATED=true || CREATED=false

          if echo "$RESULT" | grep -q "already exists"; then
            echo "  Azure AI Project Manager: already assigned"
          elif [ "$CREATED" = true ]; then
            echo "  Azure AI Project Manager: newly assigned — waiting 90s for RBAC propagation..."
            sleep 90
          else
            echo "::error::Failed to assign Azure AI Project Manager to deployer: $RESULT"
            exit 1
          fi

      - name: Preflight — verify chat deployment exists
        env:
          DEPLOYMENT_NAME: ${{ inputs.chat_deployment || vars.AZURE_OPENAI_DEPLOYMENT_GPT || 'gpt-5.4-pro' }}
        run: |
          RG="rg-qprisma-dev"
          ACCOUNT="aif-qprisma-dev"

          echo "Checking that chat deployment '${DEPLOYMENT_NAME}' exists on ${ACCOUNT}..."
          DEP_INFO=$(az cognitiveservices account deployment show \
            --name "$ACCOUNT" \
            --resource-group "$RG" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --query "{model:properties.model.name,version:properties.model.version,state:properties.provisioningState}" \
            -o json 2>&1) && FOUND=true || FOUND=false

          if [ "$FOUND" != true ]; then
            echo "::error::Chat deployment '${DEPLOYMENT_NAME}' was not found on ${ACCOUNT}."
            echo "$DEP_INFO"
            echo "::error::Re-run deploy-ai-foundry.yml with the right deployment name, or set vars.AZURE_OPENAI_DEPLOYMENT_GPT to an existing deployment."
            exit 1
          fi

          echo "Found deployment:"
          echo "$DEP_INFO"

      # The legacy 'agents-host' capability host has been removed from the
      # Bicep module — the refreshed Foundry hosted-agent preview no longer
      # requires it. Skipping the corresponding readiness wait.

      # App Insights connection string is auto-injected by the Foundry
      # hosted-agent platform; we do not resolve or pass it ourselves.

      - name: Resolve hosted agent runtime configuration
        id: services
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP || 'rg-qprisma-dev' }}"
          KEY_VAULT_NAME="${{ vars.KEY_VAULT_NAME || 'kv-qprisma-dev' }}"

          KEY_VAULT_URI=$(az keyvault show \
            --name "$KEY_VAULT_NAME" --resource-group "$RG" \
            --query properties.vaultUri -o tsv 2>/dev/null || echo "")
          if [ -n "$KEY_VAULT_URI" ]; then
            echo "neo4j_password_key_vault_uri=${KEY_VAULT_URI}secrets/neo4j-password" >> $GITHUB_OUTPUT
            echo "database_url_key_vault_uri=${KEY_VAULT_URI}secrets/database-url" >> $GITHUB_OUTPUT
            echo "redis_url_key_vault_uri=${KEY_VAULT_URI}secrets/redis-url" >> $GITHUB_OUTPUT
            echo "Key Vault secret URIs resolved for hosted runtime"
          else
            echo "::warning::Key Vault not found — hosted runtime secret URIs will be missing"
          fi

          STORAGE_ACCOUNT_URL=$(az storage account show \
            --name stqprismadev --resource-group "$RG" \
            --query "primaryEndpoints.blob" -o tsv 2>/dev/null || echo "")
          if [ -n "$STORAGE_ACCOUNT_URL" ]; then
            echo "azure_storage_account_url=${STORAGE_ACCOUNT_URL}" >> $GITHUB_OUTPUT
            echo "Storage account URL resolved for managed identity access"
          else
            echo "::warning::Storage account not found — AZURE_STORAGE_ACCOUNT_URL will be missing"
          fi

      - name: Register agent in Foundry
        id: register
        env:
          AZURE_AI_PROJECT_ENDPOINT: https://aif-qprisma-dev.services.ai.azure.com/api/projects/aif-qprisma-dev-project
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-qprisma-dev' }}
          CONTAINER_IMAGE: ${{ env.FULL_IMAGE }}
          ENVIRONMENT: hosted
          AZURE_USE_MANAGED_IDENTITY: 'true'
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2025-04-01-preview' }}
          AZURE_OPENAI_DEPLOYMENT_GPT: ${{ inputs.chat_deployment || vars.AZURE_OPENAI_DEPLOYMENT_GPT || 'gpt-5.4-pro' }}
          AZURE_OPENAI_DEPLOYMENT_EMBEDDING: ${{ vars.AZURE_OPENAI_DEPLOYMENT_EMBEDDING || 'text-embedding-3-large' }}
          MEMORY_STORE_NAME: ${{ vars.MEMORY_STORE_NAME }}
          MEMORY_CHAT_MODEL: ${{ vars.MEMORY_CHAT_MODEL || 'gpt-4o' }}
          MEMORY_EMBEDDING_MODEL: ${{ vars.MEMORY_EMBEDDING_MODEL || 'text-embedding-3-large' }}
          # APPLICATIONINSIGHTS_CONNECTION_STRING is reserved by the hosted-agent
          # platform and auto-injected; do not pass it here.
          OTEL_SERVICE_NAME: qprisma-hosted-agent
          # Neo4j Knowledge Graph
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER || 'neo4j' }}
          NEO4J_PASSWORD_KEY_VAULT_URI: ${{ steps.services.outputs.neo4j_password_key_vault_uri }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE || 'neo4j' }}
          # PostgreSQL
          DATABASE_URL_KEY_VAULT_URI: ${{ steps.services.outputs.database_url_key_vault_uri }}
          # Redis
          REDIS_URL_KEY_VAULT_URI: ${{ steps.services.outputs.redis_url_key_vault_uri }}
          # Azure Blob Storage (managed identity)
          AZURE_STORAGE_ACCOUNT_URL: ${{ steps.services.outputs.azure_storage_account_url }}
          # Optional: purge the agent + all versions before registering a new one.
          PURGE_BEFORE_DEPLOY: ${{ inputs.purge_before_deploy && '1' || '' }}
        run: python scripts/deploy_agent.py

      - name: Ensure hosted agent instance identity has Azure OpenAI access
        id: runtime_rbac
        env:
          AGENT_IDENTITY_PID: ${{ steps.register.outputs.agent_identity_principal_id }}
        run: |
          set -euo pipefail

          RG="rg-qprisma-dev"
          ACCOUNT="aif-qprisma-dev"
          PROJECT="${ACCOUNT}-project"
          AGENT="qprisma-video-agent"
          SUB="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          KEY_VAULT_NAME="${{ vars.KEY_VAULT_NAME || 'kv-qprisma-dev' }}"
          STORAGE_ACCOUNT="stqprismadev"

          ACCOUNT_SCOPE=$(az cognitiveservices account show \
            --name "$ACCOUNT" --resource-group "$RG" \
            --query id -o tsv)
          PROJECT_SCOPE="${ACCOUNT_SCOPE}/projects/${PROJECT}"
          KEY_VAULT_SCOPE=$(az keyvault show \
            --name "$KEY_VAULT_NAME" --resource-group "$RG" \
            --query id -o tsv)
          STORAGE_SCOPE=$(az storage account show \
            --name "$STORAGE_ACCOUNT" --resource-group "$RG" \
            --query id -o tsv)
          COGNITIVE_SERVICES_OPENAI_USER_ROLE="5e0bd9bd-7b93-4f28-af87-19fc36ad61bd"
          AZURE_AI_USER_ROLE="53ca6127-db72-4b80-b1b0-d745d6d5456d"
          KEY_VAULT_SECRETS_USER_ROLE="4633458b-17de-408a-b874-0445c86b69e6"
          STORAGE_BLOB_DATA_CONTRIBUTOR_ROLE="ba92f5b4-2d11-453d-a403-e96b0029c9fe"

          AGENT_PID="$AGENT_IDENTITY_PID"

          if [ -z "$AGENT_PID" ] || [ "$AGENT_PID" = "null" ]; then
            echo "::error::Register step did not return hosted agent runtime identity for ${AGENT}"
            exit 1
          fi

          echo "Hosted agent runtime principal: ${AGENT_PID:0:8}..."
          ASSIGNMENT_CREATED=0

          assign_role() {
            local scope="$1"
            local label="$2"
            local role_id="$3"
            local role_name="$4"
            local existing
            existing=$(az role assignment list \
              --assignee "$AGENT_PID" \
              --scope "$scope" \
              --query "[?roleDefinitionId=='/subscriptions/${SUB}/providers/Microsoft.Authorization/roleDefinitions/${role_id}'].id | [0]" \
              -o tsv)

            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              echo "  ${role_name} already assigned at ${label}"
              return
            fi

            echo "  Assigning ${role_name} at ${label}..."
            az role assignment create \
              --assignee-object-id "$AGENT_IDENTITY_PID" \
              --assignee-principal-type ServicePrincipal \
              --role "$role_id" \
              --scope "$scope" \
              --output none
            ASSIGNMENT_CREATED=1
          }

          assign_role "$ACCOUNT_SCOPE" "Foundry account scope" "$COGNITIVE_SERVICES_OPENAI_USER_ROLE" "Cognitive Services OpenAI User"
          assign_role "$ACCOUNT_SCOPE" "Foundry account scope" "$AZURE_AI_USER_ROLE" "Azure AI User"
          assign_role "$PROJECT_SCOPE" "Foundry project scope" "$AZURE_AI_USER_ROLE" "Azure AI User"
          assign_role "$KEY_VAULT_SCOPE" "Key Vault scope" "$KEY_VAULT_SECRETS_USER_ROLE" "Key Vault Secrets User"
          assign_role "$STORAGE_SCOPE" "Storage account scope" "$STORAGE_BLOB_DATA_CONTRIBUTOR_ROLE" "Storage Blob Data Contributor"

          if [ "$ASSIGNMENT_CREATED" = "1" ]; then
            echo "Waiting for hosted runtime role assignment propagation..."
            sleep 60
          fi

          az role assignment list \
            --assignee "$AGENT_PID" \
            --scope "$ACCOUNT_SCOPE" \
            --include-inherited \
            --query "[?roleDefinitionId=='/subscriptions/${SUB}/providers/Microsoft.Authorization/roleDefinitions/${AZURE_AI_USER_ROLE}'].{role:roleDefinitionName,scope:scope}" \
            -o table

      - name: Deployment summary
        run: |
          echo "## Hosted Agent Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | qprisma-video-agent |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${FULL_IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.register.outputs.agent_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Active | ${{ steps.register.outputs.agent_active }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Method | Python SDK (AIProjectClient) |" >> $GITHUB_STEP_SUMMARY
          echo "| Resources | 2 CPU, 4Gi RAM |" >> $GITHUB_STEP_SUMMARY
