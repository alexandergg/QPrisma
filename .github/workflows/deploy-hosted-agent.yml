name: Deploy Hosted Agent

run-name: Deploy hosted agent to Foundry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hosted-agent.yml'
      - 'azure.yaml'
      - 'backend/agent/**'
      - 'backend/core/**'
      - 'backend/services/**'
      - 'backend/models/**'
      - 'infra/hooks/**'
      - 'infra/modules/ai-foundry.bicep'
      - 'infra/parameters/ai-foundry-dev.bicepparam'
  workflow_dispatch:
    inputs:
      chat_deployment:
        description: >-
          Azure OpenAI chat deployment name to use for the hosted video agent.
          Must already be provisioned in Foundry by deploy-ai-foundry.yml.
          Switch models for A/B tests by re-running this workflow with a different value
          (e.g. gpt-5.5). Falls back to the AZURE_OPENAI_DEPLOYMENT_GPT
          repository variable, then to gpt-5.5.
        required: false
        default: gpt-5.5
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-dev
  cancel-in-progress: false

env:
  AZD_ENV_NAME: dev
  SERVICE_NAME: qprisma-video-agent
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-qprisma-dev' }}
  AZURE_AI_ACCOUNT_NAME: ${{ vars.AZURE_AI_ACCOUNT_NAME || 'aif-qprisma-dev' }}
  AZURE_AI_PROJECT_NAME: ${{ vars.AZURE_AI_PROJECT_NAME || 'aif-qprisma-dev-project' }}
  AZURE_AI_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT || 'https://aif-qprisma-dev.services.ai.azure.com/api/projects/aif-qprisma-dev-project' }}
  AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT || 'https://aif-qprisma-dev.openai.azure.com/' }}
  ACR_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME || 'stqprismadev' }}

jobs:
  deploy-hosted-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Authenticate azd
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}" \
            --federated-credential-provider github

      - name: Install Foundry hosted-agent extension
        run: |
          azd extension install azure.ai.agents || azd extension upgrade azure.ai.agents

      - name: Show azd deployment tooling
        run: |
          set -euo pipefail
          azd version
          azd extension list

      - name: Initialize azd environment
        run: |
          set -euo pipefail
          azd env select "$AZD_ENV_NAME" --no-prompt 2>/dev/null || \
            azd env new "$AZD_ENV_NAME" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --location "$AZURE_LOCATION" \
              --no-prompt

      - name: Validate hosted-agent Docker platform
        run: |
          set -euo pipefail
          if ! grep -Eq '^[[:space:]]+platform:[[:space:]]+linux/amd64[[:space:]]*$' azure.yaml; then
            echo "::error::Hosted agent container builds must target linux/amd64."
            exit 1
          fi

      - name: Ensure ACR pull access for Foundry
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          RG="${AZURE_RESOURCE_GROUP}"
          ACCOUNT="${AZURE_AI_ACCOUNT_NAME}"
          PROJECT="${AZURE_AI_PROJECT_NAME}"

          if [ -z "${ACR_SERVER}" ]; then
            echo "::warning::ACR_LOGIN_SERVER repository variable is not set; skipping explicit AcrPull assignment"
            exit 0
          fi

          ACR_ID=$(az acr show --name "${ACR_SERVER%%.*}" --query id -o tsv)
          echo "Granting AcrPull to AI Foundry identities on ACR..."

          ACCOUNT_PID=$(az cognitiveservices account show \
            --name "${ACCOUNT}" --resource-group "${RG}" \
            --query identity.principalId -o tsv)

          PROJECT_PID=$(az rest --method GET \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.CognitiveServices/accounts/${ACCOUNT}/projects/${PROJECT}?api-version=2025-06-01" \
            --query identity.principalId -o tsv)

          ACR_PULL_ROLE="7f951dda-4ed3-4680-a7ca-43fe172d538d"

          for PID in $ACCOUNT_PID $PROJECT_PID; do
            if [ -n "$PID" ]; then
              RESULT=$(az role assignment create \
                --assignee-object-id "$PID" \
                --assignee-principal-type ServicePrincipal \
                --role "$ACR_PULL_ROLE" \
                --scope "$ACR_ID" \
                --only-show-errors 2>&1) && CREATED=true || CREATED=false

              if [ "$CREATED" = true ] || echo "$RESULT" | grep -q "RoleAssignmentExists"; then
                echo "  AcrPull ready for principal ${PID:0:8}..."
              else
                echo "::warning::Could not assign AcrPull to principal ${PID:0:8}: $RESULT"
              fi
            fi
          done

      - name: Ensure deployer can manage Foundry project
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          RG="${AZURE_RESOURCE_GROUP}"
          ACCOUNT="${AZURE_AI_ACCOUNT_NAME}"
          PROJECT="${AZURE_AI_PROJECT_NAME}"
          APP_ID="${{ secrets.AZURE_CLIENT_ID }}"

          DEPLOYER_OBJECT_ID=$(az ad sp show --id "$APP_ID" --query id -o tsv)
          PROJECT_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.CognitiveServices/accounts/${ACCOUNT}/projects/${PROJECT}"
          AI_PROJECT_MANAGER_ROLE="eadc314b-1a2d-4efa-be10-5d325db5065e"

          RESULT=$(az role assignment create \
            --assignee-object-id "$DEPLOYER_OBJECT_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "$AI_PROJECT_MANAGER_ROLE" \
            --scope "$PROJECT_ID" \
            --only-show-errors 2>&1) && CREATED=true || CREATED=false

          if [ "$CREATED" = true ]; then
            echo "Azure AI Project Manager assigned to deployer; waiting 90s for RBAC propagation..."
            sleep 90
          elif echo "$RESULT" | grep -q "RoleAssignmentExists"; then
            echo "Azure AI Project Manager already assigned to deployer."
          else
            echo "::error::Failed to assign Azure AI Project Manager to deployer: $RESULT"
            exit 1
          fi

      - name: Preflight - verify chat deployment exists
        env:
          DEPLOYMENT_NAME: ${{ inputs.chat_deployment || vars.AZURE_OPENAI_DEPLOYMENT_GPT || 'gpt-5.5' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOYMENT_NAME}" ]; then
            echo "::error::No chat deployment configured. Set workflow input chat_deployment, vars.AZURE_OPENAI_DEPLOYMENT_GPT, or keep the gpt-5.5 default."
            exit 1
          fi

          DEP_INFO=$(az cognitiveservices account deployment show \
            --name "${AZURE_AI_ACCOUNT_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --query "{model:properties.model.name,version:properties.model.version,state:properties.provisioningState}" \
            -o json 2>&1) && FOUND=true || FOUND=false

          if [ "$FOUND" != true ]; then
            echo "::error::Chat deployment '${DEPLOYMENT_NAME}' was not found on ${AZURE_AI_ACCOUNT_NAME}."
            echo "$DEP_INFO"
            exit 1
          fi

          echo "Found deployment:"
          echo "$DEP_INFO"

      - name: Resolve hosted agent runtime configuration
        id: services
        env:
          GH_NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          GH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          KEY_VAULT_NAME="${{ vars.KEY_VAULT_NAME || 'kv-qprisma-dev' }}"

          fetch_secret() {
            local secret_name="$1"
            az keyvault secret show \
              --vault-name "$KEY_VAULT_NAME" \
              --name "$secret_name" \
              --query value -o tsv 2>/dev/null || true
          }

          set_secret_output() {
            local output_name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::warning::${output_name} could not be resolved"
              return
            fi

            echo "::add-mask::$value"
            printf '%s=%s\n' "$output_name" "$value" >> "$GITHUB_OUTPUT"
          }

          NEO4J_PASSWORD="${GH_NEO4J_PASSWORD:-$(fetch_secret neo4j-password)}"
          DATABASE_URL="${GH_DATABASE_URL:-$(fetch_secret database-url)}"
          AZURE_STORAGE_CONNECTION_STRING="${GH_AZURE_STORAGE_CONNECTION_STRING:-$(az storage account show-connection-string \
            --name "$STORAGE_ACCOUNT_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query connectionString -o tsv 2>/dev/null || true)}"

          set_secret_output "neo4j_password" "$NEO4J_PASSWORD"
          set_secret_output "database_url" "$DATABASE_URL"
          set_secret_output "azure_storage_connection_string" "$AZURE_STORAGE_CONNECTION_STRING"

      - name: Configure azd environment
        env:
          CHAT_DEPLOYMENT: ${{ inputs.chat_deployment || vars.AZURE_OPENAI_DEPLOYMENT_GPT || 'gpt-5.5' }}
          EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT_EMBEDDING || 'text-embedding-3-large' }}
          MEMORY_STORE_NAME: ${{ vars.MEMORY_STORE_NAME }}
          MEMORY_CHAT_MODEL: ${{ vars.MEMORY_CHAT_MODEL || 'gpt-5.5' }}
          MEMORY_EMBEDDING_MODEL: ${{ vars.MEMORY_EMBEDDING_MODEL || 'text-embedding-3-large' }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER || 'neo4j' }}
          NEO4J_PASSWORD: ${{ steps.services.outputs.neo4j_password }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE || 'neo4j' }}
          DATABASE_URL: ${{ steps.services.outputs.database_url }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ steps.services.outputs.azure_storage_connection_string }}
        run: |
          set -euo pipefail
          azd env select "$AZD_ENV_NAME" || azd env new "$AZD_ENV_NAME" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --location "$AZURE_LOCATION" \
            --no-prompt

          set_azd_env() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
            azd env set "$name" "$value"
          }

          set_azd_env AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          set_azd_env AZURE_TENANT_ID "${{ secrets.AZURE_TENANT_ID }}"
          set_azd_env AZURE_LOCATION "$AZURE_LOCATION"
          set_azd_env AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          set_azd_env AZURE_AI_PROJECT_NAME "$AZURE_AI_PROJECT_NAME"
          set_azd_env AZURE_AI_PROJECT_ID "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.CognitiveServices/accounts/${AZURE_AI_ACCOUNT_NAME}/projects/${AZURE_AI_PROJECT_NAME}"
          set_azd_env AZURE_AI_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          set_azd_env AZURE_AI_FOUNDRY_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          set_azd_env AZURE_OPENAI_ENDPOINT "$AZURE_OPENAI_ENDPOINT"
          set_azd_env AZURE_OPENAI_API_VERSION "${{ vars.AZURE_OPENAI_API_VERSION || '2025-04-01-preview' }}"
          set_azd_env AZURE_OPENAI_DEPLOYMENT_GPT "$CHAT_DEPLOYMENT"
          set_azd_env AZURE_OPENAI_DEPLOYMENT_EMBEDDING "$EMBEDDING_DEPLOYMENT"
          set_azd_env AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR_SERVER"
          set_azd_env AZURE_STORAGE_ACCOUNT_NAME "$STORAGE_ACCOUNT_NAME"
          set_azd_env AZURE_USE_MANAGED_IDENTITY "true"
          set_azd_env AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING "true"
          set_azd_env AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED "${{ vars.AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED || 'false' }}"
          set_azd_env ENVIRONMENT "hosted"
          set_azd_env LOG_LEVEL "${{ vars.HOSTED_AGENT_LOG_LEVEL || 'INFO' }}"
          set_azd_env OTEL_SERVICE_NAME "qprisma-hosted-agent"
          set_azd_env NEO4J_URI "$NEO4J_URI"
          set_azd_env NEO4J_USER "$NEO4J_USER"
          set_azd_env NEO4J_PASSWORD "$NEO4J_PASSWORD"
          set_azd_env NEO4J_DATABASE "$NEO4J_DATABASE"
          set_azd_env DATABASE_URL "$DATABASE_URL"
          set_azd_env AZURE_STORAGE_CONNECTION_STRING "$AZURE_STORAGE_CONNECTION_STRING"
          set_azd_env MEMORY_STORE_NAME "$MEMORY_STORE_NAME"
          set_azd_env MEMORY_CHAT_MODEL "$MEMORY_CHAT_MODEL"
          set_azd_env MEMORY_EMBEDDING_MODEL "$MEMORY_EMBEDDING_MODEL"
          set_azd_env REQUIRE_AGENT_IDENTITY_RBAC "${{ vars.REQUIRE_AGENT_IDENTITY_RBAC || 'false' }}"

      - name: Deploy hosted agent with azd
        run: |
          set -euo pipefail
          azd deploy "$SERVICE_NAME" --no-prompt

      - name: Inspect deployed agent
        id: inspect
        run: |
          set -euo pipefail
          RAW_JSON="$(azd ai agent show "$SERVICE_NAME" --output json 2>/dev/null || true)"
          if [ -z "$RAW_JSON" ]; then
            echo "::warning::azd ai agent show did not return agent details"
            echo "agent_version=" >> "$GITHUB_OUTPUT"
            echo "agent_status=" >> "$GITHUB_OUTPUT"
            echo "identity_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export RAW_JSON
          python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["RAW_JSON"])
          versions = payload.get("versions")
          latest = versions.get("latest") if isinstance(versions, dict) else {}
          if not isinstance(latest, dict):
              latest = {}
          instance_identity = payload.get("instance_identity")
          if not isinstance(instance_identity, dict):
              instance_identity = {}

          summary = {
              "id": payload.get("id"),
              "name": payload.get("name"),
              "object": payload.get("object"),
              "instance_identity": {
                  "principal_id_available": bool(instance_identity.get("principal_id")),
              },
              "versions": {
                  "latest": {
                      "id": latest.get("id") or "",
                      "version": latest.get("version") or "",
                      "status": latest.get("status") or "",
                  },
              },
          }
          with open("hosted-agent-inspection.json", "w", encoding="utf-8") as output:
              json.dump(summary, output, indent=2, sort_keys=True)
              output.write("\n")
          PY
          unset RAW_JSON

          VERSION="$(python -c "import json; data=json.load(open('hosted-agent-inspection.json', encoding='utf-8')); print(data.get('versions', {}).get('latest', {}).get('version') or '')")"
          STATUS="$(python -c "import json; data=json.load(open('hosted-agent-inspection.json', encoding='utf-8')); print(data.get('versions', {}).get('latest', {}).get('status') or '')")"
          IDENTITY_AVAILABLE="$(python -c "import json; data=json.load(open('hosted-agent-inspection.json', encoding='utf-8')); print(str(data.get('instance_identity', {}).get('principal_id_available', False)).lower())")"

          echo "agent_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "agent_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "identity_available=$IDENTITY_AVAILABLE" >> "$GITHUB_OUTPUT"

      - name: Upload redacted deployment inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-agent-inspection
          path: hosted-agent-inspection.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Deployment summary
        if: always()
        run: |
          echo "## Hosted Agent Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Agent | ${SERVICE_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | \`${SERVICE_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.inspect.outputs.agent_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ steps.inspect.outputs.agent_status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime identity available | ${{ steps.inspect.outputs.identity_available }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Method | azd + azure.ai.agent |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resources | 2 CPU, 4Gi RAM |" >> "$GITHUB_STEP_SUMMARY"
