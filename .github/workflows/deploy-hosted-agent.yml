name: Deploy Hosted Agent

run-name: Deploy hosted agent to Foundry via azd

on:
  push:
    branches: [main]
    paths:
      - 'backend/agent/**'
      - 'azure.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-dev
  cancel-in-progress: false

jobs:
  deploy-hosted-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install azd AI agent extension
        run: azd extension install azure.ai.agents
        env:
          AZURE_DEV_NO_PROMPT: "true"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login azd (federated)
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --federated-credential-provider github \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Configure azd environment
        run: |
          azd env new dev --no-prompt 2>/dev/null || true
          azd env select dev

          azd env set AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}"
          azd env set AZURE_LOCATION "swedencentral"

          # Resolve Foundry project endpoint
          ACCOUNT_NAME="aif-qprisma-dev"
          PROJECT_NAME="${ACCOUNT_NAME}-project"
          PROJECT_ENDPOINT="https://${ACCOUNT_NAME}.services.ai.azure.com/api/projects/${PROJECT_NAME}"
          azd env set AZURE_AI_FOUNDRY_PROJECT_ENDPOINT "$PROJECT_ENDPOINT"

          # Container registry
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "${{ vars.ACR_LOGIN_SERVER }}"

          echo "Configured azd env:"
          echo "  Project endpoint: $PROJECT_ENDPOINT"
          echo "  ACR: ${{ vars.ACR_LOGIN_SERVER }}"

      - name: Debug agent files
        run: |
          echo "=== azure.yaml ==="
          cat azure.yaml
          echo ""
          echo "=== agent.yaml ==="
          cat backend/agent/hosted/agent.yaml
          echo ""
          echo "=== Project dir listing ==="
          ls -la backend/agent/hosted/

      - name: Deploy hosted agent
        run: azd deploy --service agent --no-prompt

      - name: Deployment summary
        run: |
          echo "## Hosted Agent Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | qprisma-video-agent |" >> $GITHUB_STEP_SUMMARY
          echo "| Method | azd deploy |" >> $GITHUB_STEP_SUMMARY
          echo "| Resources | 2 CPU, 4Gi RAM |" >> $GITHUB_STEP_SUMMARY
          echo "| Protocols | Responses API v1, A2A v0.2.1 |" >> $GITHUB_STEP_SUMMARY
