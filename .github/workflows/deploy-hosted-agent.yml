name: Deploy Hosted Agent

run-name: Deploy hosted agent to Foundry

on:
  push:
    branches: [main]
    paths:
      - 'backend/agent/**'
      - 'backend/core/**'
      - 'backend/services/**'
      - 'backend/models/**'
      - 'scripts/deploy_agent.py'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-dev
  cancel-in-progress: false

env:
  IMAGE_NAME: qprisma-video-agent
  ACR_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  deploy-hosted-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${ACR_SERVER%%.*}"

      - name: Build and push agent image
        working-directory: backend
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          FULL_IMAGE="${ACR_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${ACR_SERVER}/${IMAGE_NAME}:latest"

          echo "Building ${FULL_IMAGE}"
          docker build \
            --platform linux/amd64 \
            -f agent/hosted/Dockerfile \
            -t "${FULL_IMAGE}" \
            -t "${LATEST_IMAGE}" \
            .

          docker push "${FULL_IMAGE}"
          docker push "${LATEST_IMAGE}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "FULL_IMAGE=${FULL_IMAGE}" >> $GITHUB_ENV

      - name: Install SDK dependencies
        run: pip install "azure-ai-projects==2.0.0b3" "azure-identity>=1.25.0"

      - name: Register agent in Foundry
        id: register
        env:
          AZURE_AI_PROJECT_ENDPOINT: https://aif-qprisma-dev.services.ai.azure.com/api/projects/aif-qprisma-dev-project
          CONTAINER_IMAGE: ${{ env.FULL_IMAGE }}
          ENVIRONMENT: production
        run: python scripts/deploy_agent.py

      - name: Install cognitiveservices CLI extension
        run: az extension add --name cognitiveservices --upgrade --yes

      - name: Start hosted agent
        run: |
          AGENT_VERSION="${{ steps.register.outputs.agent_version }}"
          echo "Starting agent version ${AGENT_VERSION}"
          az cognitiveservices agent start \
            --account-name aif-qprisma-dev \
            --project-name aif-qprisma-dev-project \
            --name qprisma-video-agent \
            --agent-version "${AGENT_VERSION}" \
            --min-replicas 1 \
            --max-replicas 2

      - name: Deployment summary
        run: |
          echo "## Hosted Agent Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | qprisma-video-agent |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${FULL_IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Method | Python SDK (AIProjectClient) |" >> $GITHUB_STEP_SUMMARY
          echo "| Resources | 2 CPU, 4Gi RAM |" >> $GITHUB_STEP_SUMMARY
