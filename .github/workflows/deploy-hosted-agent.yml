name: Deploy Hosted Agent

run-name: Deploy hosted agent to Foundry

on:
  push:
    branches: [main]
    paths:
      - 'backend/agent/**'
      - 'backend/core/**'
      - 'backend/services/**'
      - 'backend/models/**'
      - 'scripts/deploy_agent.py'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-dev
  cancel-in-progress: false

env:
  IMAGE_NAME: qprisma-video-agent
  ACR_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  deploy-hosted-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${ACR_SERVER%%.*}"

      - name: Build and push agent image
        working-directory: backend
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          FULL_IMAGE="${ACR_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
          LATEST_IMAGE="${ACR_SERVER}/${IMAGE_NAME}:latest"

          echo "Building ${FULL_IMAGE}"
          docker build \
            --platform linux/amd64 \
            -f agent/hosted/Dockerfile \
            -t "${FULL_IMAGE}" \
            -t "${LATEST_IMAGE}" \
            .

          docker push "${FULL_IMAGE}"
          docker push "${LATEST_IMAGE}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "FULL_IMAGE=${FULL_IMAGE}" >> $GITHUB_ENV

      - name: Install SDK dependencies
        run: pip install "azure-ai-projects==2.0.0b3" "azure-identity>=1.25.0"

      - name: Ensure ACR pull access for Foundry
        run: |
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          RG="rg-qprisma-dev"
          ACCOUNT="aif-qprisma-dev"
          ACR_ID=$(az acr show --name "${ACR_SERVER%%.*}" --query id -o tsv)
          echo "ACR resource ID: ${ACR_ID}"

          echo "Granting AcrPull to AI Foundry identities on ACR..."

          # Get AI Foundry account principal ID
          ACCOUNT_PID=$(az cognitiveservices account show \
            --name ${ACCOUNT} --resource-group ${RG} \
            --query identity.principalId -o tsv)
          echo "  Account principal: ${ACCOUNT_PID:0:8}..."

          # Get AI Foundry project principal ID
          PROJECT_PID=$(az rest --method GET \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/providers/Microsoft.CognitiveServices/accounts/${ACCOUNT}/projects/${ACCOUNT}-project?api-version=2025-06-01" \
            --query identity.principalId -o tsv)
          echo "  Project principal: ${PROJECT_PID:0:8}..."

          # AcrPull built-in role (verified from Azure RBAC docs)
          ACR_PULL_ROLE="7f951dda-4ed3-4680-a7ca-43fe172d538d"

          for PID in $ACCOUNT_PID $PROJECT_PID; do
            if [ -n "$PID" ]; then
              echo "  Assigning AcrPull to principal: ${PID:0:8}..."
              az role assignment create \
                --assignee-object-id "$PID" \
                --assignee-principal-type ServicePrincipal \
                --role "$ACR_PULL_ROLE" \
                --scope "$ACR_ID" \
                --output none 2>&1 || echo "    (already assigned)"
            fi
          done

          # Verify assignments exist
          echo "Verifying AcrPull assignments..."
          az role assignment list --scope "$ACR_ID" --role "AcrPull" --query "[].{principal:principalId,type:principalType}" -o table
          echo "ACR access configured"

      - name: Ensure deployer has required RBAC roles
        run: |
          RG="rg-qprisma-dev"
          ACCOUNT="aif-qprisma-dev"

          # Get the OIDC service principal object ID
          DEPLOYER_PID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          echo "Deployer principal: ${DEPLOYER_PID:0:8}..."

          # AI Foundry account resource ID
          AI_ACCOUNT_ID=$(az cognitiveservices account show \
            --name ${ACCOUNT} --resource-group ${RG} \
            --query id -o tsv)

          # Roles required for hosted agent deployment:
          #   Azure AI Developer  — control-plane + OpenAI/Speech/ContentSafety data actions
          #   Cognitive Services User — wildcard data action (Microsoft.CognitiveServices/*)
          #     which covers AIServices/agents/write needed by AIProjectClient
          declare -A ROLES=(
            ["Azure AI Developer"]="64702f94-c441-49e6-a78b-ef80e0188fee"
            ["Cognitive Services User"]="a97b65f3-24c7-4388-baec-2e87135dc908"
          )

          NEED_WAIT=false
          for ROLE_NAME in "${!ROLES[@]}"; do
            ROLE_ID="${ROLES[$ROLE_NAME]}"
            echo "Assigning ${ROLE_NAME} on AI Foundry account..."
            RESULT=$(az role assignment create \
              --assignee-object-id "$DEPLOYER_PID" \
              --assignee-principal-type ServicePrincipal \
              --role "$ROLE_ID" \
              --scope "$AI_ACCOUNT_ID" \
              --output json 2>&1) && CREATED=true || CREATED=false

            if echo "$RESULT" | grep -q "already exists"; then
              echo "  ${ROLE_NAME}: already assigned"
            elif [ "$CREATED" = true ]; then
              echo "  ${ROLE_NAME}: newly assigned"
              NEED_WAIT=true
            else
              echo "  ${ROLE_NAME}: (result: $RESULT)"
            fi
          done

          if [ "$NEED_WAIT" = true ]; then
            echo "New role(s) assigned — waiting 120s for RBAC propagation..."
            sleep 120
          else
            echo "All roles already assigned — no wait needed"
          fi
          echo "RBAC roles configured"

      - name: Ensure hosted agent identity has Cognitive Services access
        run: |
          RG="rg-qprisma-dev"
          ACCOUNT="aif-qprisma-dev"
          SUB="${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          AI_ACCOUNT_ID=$(az cognitiveservices account show \
            --name ${ACCOUNT} --resource-group ${RG} \
            --query id -o tsv)

          # Get project managed identity (used by hosted agent containers)
          PROJECT_PID=$(az rest --method GET \
            --url "https://management.azure.com/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.CognitiveServices/accounts/${ACCOUNT}/projects/${ACCOUNT}-project?api-version=2025-06-01" \
            --query identity.principalId -o tsv)
          echo "Project principal: ${PROJECT_PID:0:8}..."

          # Cognitive Services User — grants OpenAI data actions for the hosted container
          CS_USER_ROLE="a97b65f3-24c7-4388-baec-2e87135dc908"

          echo "Assigning Cognitive Services User to project identity..."
          az role assignment create \
            --assignee-object-id "$PROJECT_PID" \
            --assignee-principal-type ServicePrincipal \
            --role "$CS_USER_ROLE" \
            --scope "$AI_ACCOUNT_ID" \
            --output none 2>&1 || echo "  (already assigned)"

          # Also grant to AI Foundry account identity
          ACCOUNT_PID=$(az cognitiveservices account show \
            --name ${ACCOUNT} --resource-group ${RG} \
            --query identity.principalId -o tsv)
          echo "Account principal: ${ACCOUNT_PID:0:8}..."

          az role assignment create \
            --assignee-object-id "$ACCOUNT_PID" \
            --assignee-principal-type ServicePrincipal \
            --role "$CS_USER_ROLE" \
            --scope "$AI_ACCOUNT_ID" \
            --output none 2>&1 || echo "  (already assigned)"

          echo "Cognitive Services access configured for hosted agents"

      - name: Wait for capability host readiness
        run: |
          echo "Checking capability host provisioning state..."
          ACCOUNT_NAME="aif-qprisma-dev"
          RG="${{ vars.AZURE_RESOURCE_GROUP || 'rg-qprisma-dev' }}"
          MAX_WAIT=900  # 15 minutes max
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATE=$(az rest --method GET \
              --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${RG}/providers/Microsoft.CognitiveServices/accounts/${ACCOUNT_NAME}/capabilityHosts/agents-host?api-version=2025-10-01-preview" \
              --query "properties.provisioningState" -o tsv 2>/dev/null || echo "Unknown")

            echo "  [$ELAPSED s] Capability host state: $STATE"

            if [ "$STATE" = "Succeeded" ]; then
              echo "Capability host is ready."
              break
            elif [ "$STATE" = "Failed" ]; then
              echo "::error::Capability host provisioning failed."
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "::warning::Capability host not confirmed ready after ${MAX_WAIT}s. Proceeding anyway."
          fi

      # App Insights connection string is auto-injected by the Foundry
      # hosted-agent platform; we do not resolve or pass it ourselves.

      - name: Resolve backend service endpoints
        id: services
        env:
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP || 'rg-qprisma-dev' }}"

          # Neo4j AuraDB — URI from GitHub secrets (no Container App to resolve)
          echo "Neo4j URI provided via secrets (AuraDB)"

          # PostgreSQL Flexible Server
          PG_FQDN=$(az postgres flexible-server show \
            --name psql-qprisma-dev --resource-group "$RG" \
            --query "fullyQualifiedDomainName" -o tsv 2>/dev/null || echo "")
          if [ -n "$PG_FQDN" ]; then
            echo "pg_fqdn=${PG_FQDN}" >> $GITHUB_OUTPUT
            DB_URL="postgresql://qprismaadmin:${DB_ADMIN_PASSWORD}@${PG_FQDN}:5432/qprisma?sslmode=require"
            echo "::add-mask::${DB_URL}"
            echo "database_url=${DB_URL}" >> $GITHUB_OUTPUT
            echo "PostgreSQL FQDN: ${PG_FQDN}"
          else
            echo "::warning::PostgreSQL Flexible Server not found — DATABASE_URL will be missing"
          fi

          # Azure Managed Redis Enterprise (Microsoft.Cache/redisEnterprise)
          REDIS_HOST=$(az redisenterprise show \
            --name redis-qprisma-dev --resource-group "$RG" \
            --query "hostName" -o tsv 2>/dev/null || echo "")
          REDIS_PORT="${REDIS_PORT:-10000}"
          # Azure CLI resolves Redis Enterprise database keys at the cluster scope.
          REDIS_KEY=$(az redisenterprise database list-keys \
            --cluster-name redis-qprisma-dev --resource-group "$RG" \
            --query "primaryKey" -o tsv 2>/dev/null || echo "")
          if [ -n "$REDIS_HOST" ] && [ -n "$REDIS_KEY" ]; then
            echo "::add-mask::${REDIS_KEY}"
            echo "redis_url=rediss://:${REDIS_KEY}@${REDIS_HOST}:${REDIS_PORT}/0" >> $GITHUB_OUTPUT
            echo "Redis host: ${REDIS_HOST}:${REDIS_PORT}"
          elif [ -z "$REDIS_HOST" ]; then
            echo "::warning::Redis Enterprise cluster not found — REDIS_URL will be missing"
          else
            echo "::warning::Redis Enterprise access keys unavailable — REDIS_URL will be missing"
          fi

          # Azure Storage Account
          STORAGE_CONN=$(az storage account show-connection-string \
            --name stqprismadev --resource-group "$RG" \
            --query "connectionString" -o tsv 2>/dev/null || echo "")
          if [ -n "$STORAGE_CONN" ]; then
            echo "::add-mask::${STORAGE_CONN}"
            echo "storage_connection_string=${STORAGE_CONN}" >> $GITHUB_OUTPUT
            echo "Storage connection string resolved"
          else
            echo "::warning::Storage account not found — AZURE_STORAGE_CONNECTION_STRING will be missing"
          fi

      - name: Register and start agent in Foundry
        id: register
        env:
          AZURE_AI_PROJECT_ENDPOINT: https://aif-qprisma-dev.services.ai.azure.com/api/projects/aif-qprisma-dev-project
          CONTAINER_IMAGE: ${{ env.FULL_IMAGE }}
          ENVIRONMENT: hosted
          AZURE_USE_MANAGED_IDENTITY: 'true'
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-08-01-preview' }}
          AZURE_OPENAI_DEPLOYMENT_GPT: ${{ vars.AZURE_OPENAI_DEPLOYMENT_GPT || 'gpt-4o' }}
          AZURE_OPENAI_DEPLOYMENT_EMBEDDING: ${{ vars.AZURE_OPENAI_DEPLOYMENT_EMBEDDING || 'text-embedding-3-large' }}
          # APPLICATIONINSIGHTS_CONNECTION_STRING is reserved by the hosted-agent
          # platform and auto-injected; do not pass it here.
          OTEL_SERVICE_NAME: qprisma-hosted-agent
          # Neo4j Knowledge Graph
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER || 'neo4j' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE || 'neo4j' }}
          # PostgreSQL (built conditionally in resolver step — empty if PG not found)
          DATABASE_URL: ${{ steps.services.outputs.database_url }}
          # Redis
          REDIS_URL: ${{ steps.services.outputs.redis_url }}
          # Azure Blob Storage
          AZURE_STORAGE_CONNECTION_STRING: ${{ steps.services.outputs.storage_connection_string }}
        run: python scripts/deploy_agent.py

      - name: Deployment summary
        run: |
          echo "## Hosted Agent Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | qprisma-video-agent |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${FULL_IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.register.outputs.agent_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Running | ${{ steps.register.outputs.agent_running }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Method | Python SDK (AIProjectClient) |" >> $GITHUB_STEP_SUMMARY
          echo "| Resources | 2 CPU, 4Gi RAM |" >> $GITHUB_STEP_SUMMARY
