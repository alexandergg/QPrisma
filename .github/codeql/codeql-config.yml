name: "QPrisma CodeQL Configuration"

# Paths to exclude from analysis — reduces false positives from test
# fixtures, evaluation harnesses, and generated/vendored files.
paths-ignore:
  - "backend/tests"
  - "backend/evaluation"
  - "frontend/__tests__"
  - "frontend/e2e"
  - "**/*.lock"
  - "**/node_modules"
  - "scripts"

# Use the security-and-quality suite: thorough coverage without the
# experimental rules from security-extended that generate excessive
# false positives in web-framework code (FastAPI, Next.js).
queries:
  - uses: security-and-quality
