[project]
name = "qprisma-backend"
version = "1.0.0"
description = "QPrisma Backend - Intelligent Multimedia Processing Platform"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.135.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "pydantic[email]>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.1,<3.0.0",
    # Azure SDKs
    "azure-storage-blob>=12.24.0,<13.0.0",
    "azure-identity>=1.19.0,<2.0.0",
    "azure-ai-projects>=2.1.0,<3.0.0",
    "azure-ai-agents>=1.0.0",
    "openai>=1.55.0",
    # Database (PostgreSQL)
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    # Knowledge Graph
    "neo4j>=5.26.0,<6.0.0",
    # Community detection
    "networkx>=3.2,<4.0.0",
    "python-louvain>=0.16,<1.0.0",
    "leidenalg>=0.10.0,<1.0.0",
    "igraph>=0.11.0,<1.0.0",
    # LangGraph Agent Framework
    "langgraph>=1.0.7,<2.0.0",
    "langchain-core>=1.2.8,<2.0.0",
    "langchain-openai>=1.1.7,<2.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    # A2A (Agent-to-Agent) Protocol
    "a2a-sdk[http-server]>=0.3.22,<1.0.0",
    # Async I/O
    "aiofiles>=24.1.0,<25.0.0",
    "aiohttp>=3.13.0,<4.0.0",
    "azure-servicebus>=7.13.0,<8.0.0",
    # Utils
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "PyJWT[crypto]>=2.9.0,<3.0.0",
    # Rate Limiting
    "slowapi>=0.1.9,<1.0.0",
    # Telemetry / Tracing (Azure Monitor + OpenTelemetry)
    # azure-monitor-opentelemetry>=1.8.4 supports opentelemetry-sdk>=1.40 cleanly
    # (the pre-1.8.4 LogData breakage with sdk 1.39 is resolved upstream).
    "azure-monitor-opentelemetry>=1.8.4,<2.0.0",
    "opentelemetry-sdk>=1.40.0,<2.0.0",
    "opentelemetry-api>=1.40.0,<2.0.0",
    "opentelemetry-instrumentation-openai-v2>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
hosted = [
    # Refreshed Foundry hosted agent preview (Responses API runtime).
    # See: https://learn.microsoft.com/azure/ai-foundry/agents/concepts/hosted-agents
    "azure-ai-agentserver-responses>=1.0.0b5",
    "azure-ai-agentserver-core>=2.0.0b3",
    "starlette>=1.0.0rc1,<2.0.0",
    # OpenTelemetry: agentserver-core>=2.0.0b3 requires opentelemetry-sdk>=1.40.
    # azure-monitor-opentelemetry>=1.8.4 is compatible with the post-1.39 SDK
    # (the LogData breakage that affected earlier 1.8.x versions is resolved upstream).
    "azure-monitor-opentelemetry>=1.8.4,<2.0.0",
    "opentelemetry-sdk>=1.40.0,<2.0.0",
    "opentelemetry-api>=1.40.0,<2.0.0",
    "opentelemetry-instrumentation-openai-v2>=2.0.0,<3.0.0",
    "langchain-azure-ai[opentelemetry]>=1.0.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "agent", "core", "models", "services", "evaluation_foundry"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.22.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
    "freezegun>=1.4.0",
    "hypothesis>=6.120.0",
    "black>=24.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
]

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security checks)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-import-not-at-top-of-file (intentional lazy loading)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "B905",   # zip without strict= (Python 3.10+)
    "UP042",  # StrEnum migration tracked separately
    "SIM105", # suppressible-exception (contextlib.suppress - stylistic)
    "SIM108", # ternary operator (sometimes less readable)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "F841",   # unused variables OK in tests
    "S101",   # assert usage expected in tests
    "S105",   # possible hardcoded password (test fixtures)
    "S106",   # possible hardcoded password in function arg (test fixtures)
    "S311",   # pseudo-random generators OK in tests
]

[tool.ruff.lint.isort]
known-first-party = ["api", "services", "models", "core", "evaluation_foundry"]

# =============================================================================
# Black Configuration
# =============================================================================
[tool.black]
target-version = ["py311"]
line-length = 100
exclude = '''
/(
    \.venv
    | __pycache__
    | \.git
)/
'''

# =============================================================================
# Mypy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "tests/",
    ".venv/",
    "__pycache__/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers -ra"
markers = [
    "unit: mark test as unit test",
    "integration: mark test as integration test",
    "e2e: mark test as end-to-end test",
    "slow: mark test as slow running",
    "requires_azure: mark test as requiring Azure services",
    "requires_neo4j: mark test as requiring Neo4j",
    "requires_postgres: mark test as requiring PostgreSQL",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["api", "services", "models", "core", "agent"]
branch = true
omit = [
    "tests/*",
    "evaluation_foundry/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Target: 70% overall, 90%+ for auth_service.py
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]


