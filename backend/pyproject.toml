[project]
name = "qprisma-backend"
version = "0.3.0"
description = "QPrisma Backend - Intelligent Multimedia Processing Platform"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.1",
    # Azure SDKs
    "azure-storage-blob>=12.24.0",
    "azure-identity>=1.19.0",
    "openai>=1.55.0",
    # Database (PostgreSQL)
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    # Background Processing
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # Knowledge Graph
    "neo4j>=5.26.0",
    # Image/Video Processing
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "ffmpeg-python>=0.2.0",
    "imagehash>=4.3.0",
    # LangGraph Agent Framework
    "langgraph>=1.0.7",
    "langchain-core>=1.2.8",
    "langchain-openai>=1.1.7",
    "langgraph-checkpoint-redis>=0.3.3",
    "mem0ai>=1.0.3",
    # A2A (Agent-to-Agent) Protocol
    "a2a-sdk[http-server]>=0.3.22",
    # Async I/O
    "aiofiles>=24.1.0",
    # Utils
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.2.1",
    "yt-dlp>=2026.2.4",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "agent", "core", "models", "services", "tasks", "evaluation"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.22.0",
    "factory-boy>=3.3.0",
    "faker>=33.0.0",
    "freezegun>=1.4.0",
    "hypothesis>=6.120.0",
    "mutmut>=3.2.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-import-not-at-top-of-file (intentional lazy loading)
    "E722",   # bare-except (cleanup later, low priority)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",   # raise-without-from-inside-except (too noisy, low priority)
    "B905",   # zip without strict= (Python 3.10+)
    "SIM105", # suppressible-exception (contextlib.suppress - stylistic)
    "SIM108", # ternary operator (sometimes less readable)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # unused variables OK in tests

[tool.ruff.lint.isort]
known-first-party = ["api", "services", "models", "tasks", "core", "evaluation"]

# =============================================================================
# Black Configuration
# =============================================================================
[tool.black]
target-version = ["py311"]
line-length = 100
exclude = '''
/(
    \.venv
    | __pycache__
    | \.git
)/
'''

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers -ra"
markers = [
    "unit: mark test as unit test",
    "integration: mark test as integration test",
    "e2e: mark test as end-to-end test",
    "slow: mark test as slow running",
    "requires_azure: mark test as requiring Azure services",
    "requires_redis: mark test as requiring Redis",
    "requires_neo4j: mark test as requiring Neo4j",
    "requires_postgres: mark test as requiring PostgreSQL",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["api", "services", "models", "core", "agent", "tasks"]
branch = true
omit = [
    "tests/*",
    "evaluation/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 35
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]

# =============================================================================
# Mutation Testing Configuration
# =============================================================================
[tool.mutmut]
paths_to_mutate = "core/,services/auth_service.py,api/dependencies.py,models/user.py,agent/utils/"
tests_dir = "tests/"
runner = "python -m pytest tests/ -x -q --tb=no"
