kind: hosted
name: qprisma-video-agent

protocols:
  - protocol: responses
    version: "1.0.0"

resources:
  cpu: "2"
  memory: 4Gi

environment_variables:
  # Foundry / Azure OpenAI
  - name: AZURE_AI_PROJECT_ENDPOINT
    value: "${AZURE_AI_PROJECT_ENDPOINT}"
  - name: AZURE_OPENAI_ENDPOINT
    value: "${AZURE_OPENAI_ENDPOINT}"
  - name: AZURE_OPENAI_API_VERSION
    value: "${AZURE_OPENAI_API_VERSION}"
  - name: AZURE_OPENAI_DEPLOYMENT_GPT
    value: "${AZURE_OPENAI_DEPLOYMENT_GPT}"
  - name: AZURE_OPENAI_DEPLOYMENT_EMBEDDING
    value: "${AZURE_OPENAI_DEPLOYMENT_EMBEDDING}"

  # Identity
  - name: AZURE_USE_MANAGED_IDENTITY
    value: "${AZURE_USE_MANAGED_IDENTITY}"

  # Knowledge graph
  - name: NEO4J_URI
    value: "${NEO4J_URI}"
  - name: NEO4J_USER
    value: "${NEO4J_USER}"
  - name: NEO4J_PASSWORD
    value: "${NEO4J_PASSWORD}"
  - name: NEO4J_DATABASE
    value: "${NEO4J_DATABASE}"

  # State services
  - name: DATABASE_URL
    value: "${DATABASE_URL}"
  - name: REDIS_URL
    value: "${REDIS_URL}"
  - name: AZURE_STORAGE_CONNECTION_STRING
    value: "${AZURE_STORAGE_CONNECTION_STRING}"

  # Memory
  - name: MEMORY_STORE_NAME
    value: "${MEMORY_STORE_NAME}"
  - name: MEMORY_CHAT_MODEL
    value: "${MEMORY_CHAT_MODEL}"
  - name: MEMORY_EMBEDDING_MODEL
    value: "${MEMORY_EMBEDDING_MODEL}"

  # Runtime
  - name: ENVIRONMENT
    value: "${ENVIRONMENT}"
  - name: LOG_LEVEL
    value: "${LOG_LEVEL}"
  - name: OTEL_SERVICE_NAME
    value: "${OTEL_SERVICE_NAME}"
  - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
    value: "${AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING}"
  - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
    value: "${AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED}"
