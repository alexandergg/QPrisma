# QPrisma Video Agent — Azure AI Foundry Deployment Manifest
# ===========================================================
# Declares the hosted agent container, protocols, and environment.
#
# Deploy with:
#   azd extension install azure.ai.agents
#   azd env set AZURE_AI_FOUNDRY_PROJECT_ENDPOINT <endpoint>
#   azd up

name: qprisma-video-agent
description: >
  QPrisma Video Agent — intelligent video analysis powered by LangGraph.
  Searches visual content, audio transcriptions, and knowledge graphs
  to answer questions with timestamped citations.
metadata:
  tags:
    - video-analysis
    - langgraph
    - rag
  authors:
    - alexandergg
template:
  name: QPrismaVideoAgent
  kind: hosted
  protocols:
    - protocol: responses
      version: v1
    - protocol: a2a
      version: v0.2.1
  environment_variables:
    # --- Azure OpenAI ---
    - name: AZURE_OPENAI_ENDPOINT
      value: ${AZURE_OPENAI_ENDPOINT}
    - name: AZURE_OPENAI_API_VERSION
      value: "2024-08-01-preview"
    - name: AZURE_USE_MANAGED_IDENTITY
      value: "true"
    - name: AZURE_OPENAI_DEPLOYMENT_GPT
      value: "{{chat}}"
    - name: AZURE_OPENAI_DEPLOYMENT_EMBEDDING
      value: "{{embedding}}"

    # --- Neo4j Knowledge Graph ---
    - name: NEO4J_URI
      value: ${NEO4J_URI}
    - name: NEO4J_USER
      value: ${NEO4J_USER}
    - name: NEO4J_PASSWORD
      secretKeyVaultUri: ${NEO4J_PASSWORD_KV_URI}
    - name: NEO4J_DATABASE
      value: ${NEO4J_DATABASE}

    # --- Redis ---
    - name: REDIS_URL
      secretKeyVaultUri: ${REDIS_URL_KV_URI}

    # --- PostgreSQL ---
    - name: DATABASE_URL
      secretKeyVaultUri: ${DATABASE_URL_KV_URI}

    # --- Azure Blob Storage ---
    - name: AZURE_STORAGE_CONNECTION_STRING
      secretKeyVaultUri: ${STORAGE_CONNECTION_KV_URI}

    # --- Foundry Memory Store ---
    - name: FOUNDRY_MEMORY_STORE_NAME
      value: "${FOUNDRY_MEMORY_STORE_NAME}"
    - name: FOUNDRY_MEMORY_CHAT_MODEL
      value: "${FOUNDRY_MEMORY_CHAT_MODEL}"
    - name: FOUNDRY_MEMORY_EMBEDDING_MODEL
      value: "${FOUNDRY_MEMORY_EMBEDDING_MODEL}"

    # --- Application ---
    - name: ENVIRONMENT
      value: ${ENVIRONMENT}
    - name: LOG_LEVEL
      value: "INFO"

    # --- Telemetry / Tracing ---
    - name: APPLICATIONINSIGHTS_CONNECTION_STRING
      value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}

resources:
  - kind: model
    id: gpt-4o
    name: chat
  - kind: model
    id: text-embedding-3-large
    name: embedding
