# QPrisma — Azure Developer CLI Configuration
# =============================================
# Used by `azd` to manage the hosted agent lifecycle via the AI agent extension.
# Core infrastructure (Postgres, Redis, Container Apps) is managed separately
# by deploy-infra.yml and is NOT part of this azd project.
#
# Usage:
#   azd extension install azure.ai.agents
#   azd auth login
#   azd env new dev
#   azd env set AZURE_AI_FOUNDRY_PROJECT_ENDPOINT <endpoint>
#   azd deploy --service agent
#
# Docs: https://learn.microsoft.com/azure/developer/azure-developer-cli/extensions/azure-ai-foundry-extension

name: qprisma

requiredVersions:
  extensions:
    azure.ai.agents: latest

services:
  agent:
    host: azure.ai.agent
    project: ./backend/agent/hosted
    language: docker
    docker:
      remoteBuild: true
    config:
      container:
        resources:
          cpu: "2"
          memory: 4Gi
        scale:
          maxReplicas: 3
          minReplicas: 1
